<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Question</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #2a3f80;
      margin-bottom: 16px;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #557cf2;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .back-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 127, 255, 0.4);
    }

    .logout-btn {
      position: absolute;
      top: 32px;
      right: 32px;
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    .form-container {
      padding: 32px;
    }

    .question-input-container {
      position: relative;
      margin-bottom: 32px;
    }

    .question-input {
      width: 100%;
      min-height: 120px;
      padding: 20px;
      border: 2px solid #a1caf1;
      border-radius: 12px;
      background-color: #fff;
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      resize: vertical;
      outline: none;
      transition: all 0.2s;
      color: #2a3f80;
    }

    .question-input:focus {
      border-color: #557cf2;
      background-color: #f0f4ff;
      border-style: solid;
    }

    .question-input::placeholder {
      color: #a1caf1;
    }

    .file-upload-icon {
      position: absolute;
      right: 16px;
      top: 16px;
      color: #cbd5e0;
      cursor: pointer;
      font-size: 18px;
    }
   
    .category-container {
      margin-bottom: 32px;
    }

    .category-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #2a3f80;
      margin-bottom: 16px;
    }

    .category-options {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .category-option {
      position: relative;
    }

    .category-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background-color: #f0f4ff;
      border: 2px solid #a1caf1;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #2a3f80;
      transition: all 0.2s;
      user-select: none;
    }

    .category-option input[type="radio"]:checked + .category-pill {
      background-color: #a1caf1;
      border-color: #557cf2;
      color: #003399;
    }

    .category-pill:hover {
      border-color: #557cf2;
      transform: translateY(-1px);
    }

    .mic-icon {
      font-size: 16px;
      color: #a0aec0;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #557cf2;
      color: #f0f4ff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 127, 255, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .home-btn {
      width: 100%;
      padding: 16px;
      background: transparent;
      color: #2a3f80;
      border: 2px solid #a1caf1;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: block;
      text-align: center;
      margin-top: 16px;
    }

    .home-btn:hover {
      background: #a1caf1;
      color: #003399;
      transform: translateY(-2px);
    }

    .result {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .result.error {
      background-color: #fed7d7;
      color: #c53030;
      border: 1px solid #feb2b2;
    }

    .result.success {
      background-color: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }

    .hidden {
      display: none;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .container {
        margin: 0;
        border-radius: 0;
        min-height: 100vh;
      }

      .logout-btn {
        position: relative;
        top: auto;
        right: auto;
        margin-bottom: 16px;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
      }

      .form-container {
        padding: 24px;
      }

      .category-options {
        flex-direction: column;
      }

      .category-pill {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button onclick="navigateBack()" class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 12.75C20.4142 12.75 20.75 12.4142 20.75 12C20.75 11.5858 20.4142 11.25 20 11.25V12.75ZM4 11.25C3.58579 11.25 3.25 11.5858 3.25 12C3.25 12.4142 3.58579 12.75 4 12.75V11.25ZM7.47204 17.5327C7.76624 17.8243 8.24111 17.8222 8.53269 17.528C8.82427 17.2338 8.82216 16.7589 8.52796 16.4673L7.47204 17.5327ZM6.23703 15.2527L6.76499 14.72H6.76499L6.23703 15.2527ZM6.23703 8.74731L5.70907 8.21462H5.70907L6.23703 8.74731ZM8.52796 7.53269C8.82216 7.24111 8.82428 6.76624 8.53269 6.47204C8.24111 6.17784 7.76624 6.17573 7.47204 6.46731L8.52796 7.53269ZM4.01989 12.3133L3.27591 12.4082L3.27591 12.4082L4.01989 12.3133ZM4.01989 11.6867L3.27591 11.5918L3.27591 11.5918L4.01989 11.6867ZM20 11.25H4V12.75H20V11.25ZM8.52796 16.4673L6.76499 14.72L5.70907 15.7854L7.47204 17.5327L8.52796 16.4673ZM6.76499 9.28L8.52796 7.53269L7.47204 6.46731L5.70907 8.21462L6.76499 9.28ZM6.76499 14.72C6.0495 14.0109 5.55869 13.5228 5.22659 13.1093C4.904 12.7076 4.79332 12.4496 4.76387 12.2185L3.27591 12.4082C3.35469 13.0263 3.64963 13.5412 4.05706 14.0485C4.45498 14.544 5.01863 15.1011 5.70907 15.7854L6.76499 14.72ZM5.70907 8.21462C5.01863 8.89892 4.45498 9.45597 4.05706 9.95146C3.64963 10.4588 3.3547 10.9737 3.27591 11.5918L4.76387 11.7815C4.79332 11.5504 4.904 11.2924 5.22659 10.8907C5.55869 10.4772 6.0495 9.98914 6.76499 9.28L5.70907 8.21462ZM4.76387 12.2185C4.74538 12.0734 4.74538 11.9266 4.76387 11.7815L3.27591 11.5918C3.24136 11.8629 3.24136 12.1371 3.27591 12.4082L4.76387 12.2185Z" fill="#ffffff" stroke="#ffffff" stroke-width="0.5"/>
      </svg>
    </button>
    <div class="header">
      <h1>New questions</h1>
    </div>
    <div class="form-container">
      <form id="questionForm">
        <div class="question-input-container">
          <textarea 
            id="text" 
            name="text" 
            class="question-input" 
            placeholder="Type something or drop your file here"
            required
          ></textarea>
        </div>
        <div style="margin-bottom:24px;">
          <label for="file" style="font-weight:500; color:#2a3f80;">Đính kèm (ảnh hoặc PDF, chỉ 1 file):</label><br>
          <input type="file" id="file" name="file" accept="image/*,.pdf" style="margin-top:8px;" />
          <div id="file-preview" style="margin-top:8px;"></div>
        </div>
        <div class="category-container">
          <label class="category-label">Category</label>
          <div class="category-options">
            <div class="category-option">
              <input type="radio" id="toan" name="subject" value="toán" required>
              <label for="toan" class="category-pill">
                Toán
              </label>
            </div>
            <div class="category-option">
              <input type="radio" id="ly" name="subject" value="lý" required>
              <label for="ly" class="category-pill">
                Lý
              </label>
            </div>
            <div class="category-option">
              <input type="radio" id="hoa" name="subject" value="hóa" required>
              <label for="hoa" class="category-pill">
                Hóa
              </label>
            </div>
          </div>
        </div>
        <button type="submit" class="submit-btn">Post Question</button>
      </form>
      <div id="result" class="result hidden"></div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script>
    // Role-based back navigation
    async function navigateBack() {
      try {
        // Check authentication and get user role
        const res = await fetch(`${BASE_URL}/auth/check-auth`, {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        
        if (data.isAuthenticated && data.user) {
          // Redirect based on user role
          if (data.user.role === 'learner') {
            window.location.href = '/learner.html';
          } else if (data.user.role === 'tutor') {
            window.location.href = '/tutor.html';
          } else if (data.user.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            // Fallback to index if role is unknown
            window.location.href = '/index.html';
          }
        } else {
          // Not authenticated, redirect to login/index
          window.location.href = '/index.html';
        }
      } catch (err) {
        console.error('Auth check error:', err);
        // Fallback to index on error
        window.location.href = '/index.html';
      }
    }

    // Check authentication before allowing question post
    async function checkAuthAndInit() {
      try {
        const res = await fetch(`${BASE_URL}/auth/check-auth`, {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        if (!data.isAuthenticated) {
          window.location.href = '/login.html';
          return;
        }
      } catch (err) {
        window.location.href = '/login.html';
        return;
      }

      // Only run form logic if authenticated
      const form = document.getElementById('questionForm');
      const result = document.getElementById('result');

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const text_content = form.text.value.trim();
        const subject = form.subject.value;
        const topicEl = document.getElementById('topic');
        const topic = topicEl ? topicEl.value.trim() : '';
        const fileInput = document.getElementById('file');
        const file = fileInput && fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
        result.className = 'result hidden';
        if (!text_content) {
          showResult('Please enter a question', 'error');
          return;
        }
        if (!subject) {
          showResult('Please select a category', 'error');
          return;
        }
        try {
          let fetchOptions;
          const formData = new FormData();
          formData.append('text_content', text_content);
          formData.append('subject', subject);
          if (topic) formData.append('topic', topic);
          if (file) formData.append('file', file);
          fetchOptions = {
            method: 'POST',
            body: formData,
            credentials: 'include'
          };
          const res = await fetch(`${BASE_URL}/questions`, fetchOptions);
          const data = await res.json();
          if (res.ok) {
            window.location.href = '/index.html';
          } else {
            showResult(`Error: ${data.error}`, 'error');
          }
        } catch (err) {
          showResult('Network error: Unable to connect to server', 'error');
          console.error('Fetch error:', err);
        }
      });

      function showResult(message, type) {
        result.textContent = message;
        result.className = `result ${type}`;
      }

      // File preview logic
      const fileInput = document.getElementById('file');
      const filePreview = document.getElementById('file-preview');
      fileInput.addEventListener('change', function() {
        filePreview.innerHTML = '';
        const file = this.files && this.files[0] ? this.files[0] : null;
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        if (["jpg","jpeg","png","gif","bmp","webp"].includes(ext)) {
          const img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          img.style.maxWidth = '120px';
          img.style.maxHeight = '120px';
          img.style.borderRadius = '8px';
          img.style.border = '1px solid #eee';
          filePreview.appendChild(img);
        } else if (ext === 'pdf') {
          const div = document.createElement('div');
          div.innerHTML = `<span style='font-size:32px;'>📄</span> ${file.name}`;
          filePreview.appendChild(div);
        } else {
          filePreview.innerHTML = '<span style="color:red">Chỉ cho phép ảnh hoặc PDF!</span>';
        }
      });

      // File upload functionality - NEW feature (commented for future implementation)
      const fileIcon = document.querySelector('.file-upload-icon');
      const textArea = document.getElementById('text');
      fileIcon.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*,.pdf,.doc,.docx,.txt';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            textArea.placeholder = `File selected: ${file.name}`;
          }
        };
        input.click();
      });
      textArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        textArea.style.borderColor = '#a1caf1';
        textArea.style.backgroundColor = '#f0f4ff';
      });
      textArea.addEventListener('dragleave', (e) => {
        e.preventDefault();
        textArea.style.borderColor = '#a1caf1';
        textArea.style.backgroundColor = '#f0f4ff';
      });
      textArea.addEventListener('drop', (e) => {
        e.preventDefault();
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          textArea.placeholder = `File dropped: ${files[0].name}`;
        }
        textArea.style.borderColor = '#a1caf1';
        textArea.style.backgroundColor = '#f0f4ff';
      });
      const topicInput = document.getElementById('topic');
      if (topicInput) {
        topicInput.addEventListener('input', (e) => {
          // Placeholder for future topic logic
        });
      }
    }
    // Run auth check on page load
    checkAuthAndInit();
  </script>
</body>
</html>
