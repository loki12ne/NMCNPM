<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý yêu cầu gia sư</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f0f4ff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow-x: hidden;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .header {
      width: 100%;
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      margin-bottom: 32px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 32px;
      color: #2a3f80;
      margin-bottom: 8px;
    }

    .header p {
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 0;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #557cf2;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .back-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 127, 255, 0.4);
    }

    .controls {
      background: #fff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      margin-bottom: 32px;
      width: 100%;
    }

    .refresh-btn {
      background: #557cf2;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .refresh-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 127, 255, 0.4);
    }

    .requests-grid {
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      width: 100%;
    }

    .request-card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .request-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      border-color: #557cf2;
    }

    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .request-title {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #2a3f80;
      margin-bottom: 8px;
    }

    .request-meta {
      font-size: 14px;
      color: #6b7280;
    }

    .status-badge {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'Inter', sans-serif;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-approved {
      background: #d1fae5;
      color: #065f46;
    }

    .status-rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .request-content {
      margin-bottom: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      color: #2a3f80;
    }

    .detail-value {
      color: #2a3f80;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
    }

    .request-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #f3f4f6;
    }

    .action-btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      text-align: center;
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-approve {
      background: #059669;
      color: white;
    }

    .btn-approve:hover:not(:disabled) {
      background: #047857;
      transform: translateY(-2px);
    }

    .btn-reject {
      background: #dc2626;
      color: white;
    }

    .btn-reject:hover:not(:disabled) {
      background: #b91c1c;
      transform: translateY(-2px);
    }

    .image-preview {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid #e5e7eb;
      transition: all 0.3s ease;
    }

    .image-preview:hover {
      border-color: #557cf2;
      transform: scale(1.05);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      position: relative;
      max-width: 90%;
      max-height: 90%;
    }

    .modal-image {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
    }

    .modal-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      color: #374151;
    }

    .empty-state {
      text-align: center;
      padding: 64px 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .empty-state h3 {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 24px;
      color: #2a3f80;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: #6b7280;
      margin-bottom: 24px;
      font-size: 16px;
    }

    .message {
      margin-bottom: 24px;
      padding: 16px 24px;
      border-radius: 12px;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
      width: 100%;
    }

    .message.success {
      color: #059669;
      background: #d1fae5;
      border: 1px solid #a7f3d0;
    }

    .message.error {
      color: #dc2626;
      background: #fee2e2;
      border: 1px solid #fca5a5;
    }

    .message .msg-icon {
      font-size: 18px;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f4f6;
      border-top: 4px solid #557cf2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .container {
        padding: 16px;
      }

      .header {
        padding: 24px;
      }

      .header h1 {
        font-size: 24px;
      }

      .requests-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .request-card {
        padding: 16px;
      }

      .request-actions {
        flex-direction: column;
        gap: 8px;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button onclick="window.history.back()" class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

      </svg>
    </button>

    <div class="header">
      <h1>Quản lý yêu cầu gia sư</h1>
      <p>Xem và quản lý tất cả các yêu cầu gia sư từ học sinh</p>
    </div>

    <div id="result" class="message"></div>

    <div class="controls">
      <button class="refresh-btn" onclick="loadRequests()">

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Đang tải dữ liệu...</p>
    </div>

    <div id="requestsContainer" class="requests-grid">
      <!-- Requests will be loaded here -->
    </div>

    <div id="emptyState" class="empty-state" style="display: none;">
      <h3>Chưa có yêu cầu nào</h3>
      <p>Hiện tại chưa có yêu cầu gia sư nào được gửi đến hệ thống.</p>
    </div>

  <!-- Image Modal -->
  <div id="imageModal" class="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeImageModal()">&times;</button>
      <img id="modalImage" class="modal-image" src="" alt="Preview">
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script>
    let isLoading = false;

    async function loadRequests() {
      if (isLoading) return;
      isLoading = true;
      showLoading(true);
      
      try {
        const res = await fetch(`${BASE_URL}/api/tutor-request-list`, { credentials: 'include' });
        const data = await res.json();
        
        if (res.ok && Array.isArray(data.requests)) {
          displayRequests(data.requests);
        } else {
          showEmptyState();
        }
      } catch (error) {
        console.error('Error loading requests:', error);
        showMessage('Lỗi khi tải danh sách yêu cầu: ' + error.message, 'error');
        showEmptyState();
      } finally {
        showLoading(false);
        isLoading = false;
      }
    }

    function displayRequests(requests) {
      const container = document.getElementById('requestsContainer');
      const emptyState = document.getElementById('emptyState');
      
      if (!requests || requests.length === 0) {
        showEmptyState();
        return;
      }
      
      emptyState.style.display = 'none';
      container.innerHTML = requests.map(request => createRequestCard(request)).join('');
    }

    function createRequestCard(req) {
      const statusClass = getStatusClass(req.status);
      const statusText = getStatusText(req.status);
      const imagePreview = req.student_card_image ? 
        (req.student_card_image.startsWith('http') ?
          `<img src="${req.student_card_image}" class="image-preview" onclick="openImageModal('${req.student_card_image}')" alt="Ảnh thẻ SV">` :
          `<img src="/uploads/${req.student_card_image}" class="image-preview" onclick="openImageModal('/uploads/${req.student_card_image}')" alt="Ảnh thẻ SV">`) : 
        '<span style="color: #6b7280; font-style: italic;">Không có ảnh</span>';

      return `
        <div class="request-card">
          <div class="request-header">
            <div>
              <div class="request-title">${req.full_name}</div>
              <div class="request-meta">@${req.username}</div>
            </div>
            <span class="status-badge ${statusClass}">${statusText}</span>
          </div>

          <div class="request-content">
            <div class="detail-row">
              <span class="detail-label">Trường:</span>
              <span class="detail-value">${req.university}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Khoa/ngành:</span>
              <span class="detail-value">${req.faculty}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Năm vào trường:</span>
              <span class="detail-value">${req.year}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Ảnh thẻ SV:</span>
              <span class="detail-value">${imagePreview}</span>
            </div>
          </div>

          <div class="request-actions">
            <button class="action-btn btn-approve" onclick="handleAction(${req.id}, 'approved')" ${req.status !== 'pending' ? 'disabled' : ''}>
              Duyệt
            </button>
            <button class="action-btn btn-reject" onclick="handleAction(${req.id}, 'rejected')" ${req.status !== 'pending' ? 'disabled' : ''}>
              Từ chối
            </button>
          </div>
        </div>
      `;
    }

    function getStatusClass(status) {
      switch(status) {
        case 'pending': return 'status-pending';
        case 'approved': return 'status-approved';
        case 'rejected': return 'status-rejected';
        default: return 'status-pending';
      }
    }

    function getStatusText(status) {
      switch(status) {
        case 'pending': return 'Chờ xử lý';
        case 'approved': return 'Đã duyệt';
        case 'rejected': return 'Đã từ chối';
        default: return 'Không xác định';
      }
    }

    async function handleAction(id, action) {
      try {
        const res = await fetch(`${BASE_URL}/api/tutor-request-action`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, action }),
          credentials: 'include'
        });
        const data = await res.json();
        
        if (res.ok) {
          const actionText = action === 'approved' ? 'duyệt' : 'từ chối';
          showMessage(`Đã ${actionText} yêu cầu thành công!`, 'success');
          loadRequests();
        } else {
          showMessage(data.error || 'Đã xảy ra lỗi', 'error');
        }
      } catch (error) {
        console.error('Error handling action:', error);
        showMessage('Lỗi khi xử lý yêu cầu: ' + error.message, 'error');
      }
    }

    function showLoading(show) {
      const loading = document.getElementById('loading');
      const container = document.getElementById('requestsContainer');
      
      if (show) {
        loading.style.display = 'block';
        container.style.display = 'none';
      } else {
        loading.style.display = 'none';
        container.style.display = 'grid';
      }
    }

    function showEmptyState() {
      const container = document.getElementById('requestsContainer');
      const emptyState = document.getElementById('emptyState');
      
      container.innerHTML = '';
      emptyState.style.display = 'block';
    }

    function showMessage(text, type) {
      const messageEl = document.getElementById('result');
      let icon = '';
      if (type === 'success') {
        icon = '<span class="msg-icon">✅</span>';
      } else if (type === 'error') {
        icon = '<span class="msg-icon">❌</span>';
      } else {
        icon = '<span class="msg-icon">ℹ️</span>';
      }
      
      messageEl.innerHTML = icon + text;
      messageEl.className = `message ${type}`;
      messageEl.style.display = 'flex';
      
      setTimeout(() => {
        messageEl.style.display = 'none';
      }, 5000);
    }

    function openImageModal(imageSrc) {
      const modal = document.getElementById('imageModal');
      const modalImage = document.getElementById('modalImage');
      modalImage.src = imageSrc;
      modal.classList.add('show');
    }

    function closeImageModal() {
      const modal = document.getElementById('imageModal');
      modal.classList.remove('show');
    }

    // Close modal when clicking outside
    document.getElementById('imageModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeImageModal();
      }
    });

    // Initialize
    window.onload = loadRequests;
  </script>
</body>
</html>
