<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sidebar Navigation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 200px;
      height: 100vh;
      background: #ffffff;
      border-right: 0px solid #3b82f6;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      z-index: 1000;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      font-family: 'Inter', Arial, Helvetica, sans-serif;
    }

    .sidebar-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      padding: 0 20px;
    }

    .logo-title {
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      font-style: normal;
      font-weight: 700;
      font-size: 36px;
      line-height: 1.2;
      margin: 0;
      background: linear-gradient(45deg, #557cf2, #a2b8fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-menu {
      flex: 1;
      padding: 0 15px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 20px 5px 10px 5px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 12px 10px;
      margin: 4px 0;
      border-radius: 8px;
      text-decoration: none;
      color: #6b7280;
      font-weight: 500;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-item:hover {
      background: #f3f4f6;
      color: #374151;
      transform: translateX(2px);
    }

    .nav-item.active {
      background: linear-gradient(135deg, #557cf2 0%, #a2b8fa 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(85, 124, 242, 0.3);
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }

    .nav-item:hover .nav-icon svg {
      stroke: #374151;
    }

    .nav-item.active .nav-icon svg {
      stroke: white;
    }

    .nav-text {
      font-size: 14px;
      font-weight: 500;
    }

    .user-section {
      padding: 15px 15px 0 15px;
      border-top: 1px solid #e5e7eb;
    }

    .user-item {
      display: flex;
      align-items: center;
      padding: 12px 10px;
      margin: 4px 0;
      border-radius: 8px;
      text-decoration: none;
      color: #6b7280;
      font-weight: 500;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .user-item:hover {
      background: #f3f4f6;
      color: #374151;
    }

    .user-item.active {
      background: linear-gradient(135deg, #557cf2 0%, #a2b8fa 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(85, 124, 242, 0.3);
    }

    .user-icon {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-icon svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }

    .user-item:hover .user-icon svg {
      stroke: #374151;
    }

    .user-item.active .user-icon svg {
      stroke: white;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .sidebar {
        width: 70px;
        padding: 20px 0;
      }

      .sidebar-logo {
        padding: 0 10px;
      }

      .logo-title {
        font-size: 24px;
      }

      .nav-menu {
        padding: 0 10px;
      }

      .section-title {
        display: none;
      }

      .nav-item {
        padding: 12px 8px;
        justify-content: center;
      }

      .nav-text {
        display: none;
      }

      .nav-icon {
        margin-right: 0;
      }

      .user-section {
        padding: 15px 10px 0 10px;
      }

      .user-item {
        padding: 12px 8px;
        justify-content: center;
      }

      .user-icon {
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <h1 class="logo-title">PANDA</h1>
    </div>
    
    <div class="nav-menu">
      <div class="section-title">OVERALL STATISTICS</div>
      
      <a href="/admin.html" class="nav-item" data-page="admin">
        <div class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 11.0226V17.4065C3 19.9434 5.01472 22 7.5 22H16.5C18.9853 22 21 19.9434 21 17.4065V11.0226C21 9.64488 20.3942 8.33989 19.3496 7.46745L13.4248 2.51916C12.596 1.82694 11.404 1.82695 10.5752 2.51916L4.65043 7.46745C3.60582 8.33989 3 9.64488 3 11.0226Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="nav-text">Overview</span>
      </a>
      
      <a href="/ts.html" class="nav-item" data-page="tutor-statistics">
        <div class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20.5899 22C20.5899 18.13 16.7399 15 11.9999 15C7.25991 15 3.40991 18.13 3.40991 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="nav-text">Tutor statistics</span>
      </a>
      
      <a href="/ls.html" class="nav-item" data-page="learner-statistics">
        <div class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z" stroke="currentColor" stroke-width="2"/>
            <path d="M12 14C8.13401 14 5 17.134 5 21H19C19 17.134 15.866 14 12 14Z" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <span class="nav-text">Learner statistics</span>
      </a>

      <div class="section-title">TUTOR MANAGEMENT</div>
      
      <a href="/manage-tutor-requests.html" class="nav-item" data-page="approvals">
        <div class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 12L11 14L15 10M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="nav-text">Approvals</span>
      </a>
      
      <a href="/evaluate.html" class="nav-item" data-page="evaluation">
        <div class="nav-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 2V8H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 13H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 17H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 9H9H8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="nav-text">Evaluation</span>
      </a>
    </div>
    
    <div class="user-section">
      
    </div>
  </nav>

  <script>
    // Set active nav item based on current page
    function setActiveNavItem() {
      const currentPage = window.location.pathname;
      const navItems = document.querySelectorAll('.nav-item, .user-item');
      
      navItems.forEach(item => {
        item.classList.remove('active');
        const href = item.getAttribute('href');
        const dataPage = item.getAttribute('data-page');
        
        // Handle exact matches
        if (currentPage === href) {
          item.classList.add('active');
        }
        // Handle admin home page
        else if (dataPage === 'admin' && currentPage === '/admin.html') {
          item.classList.add('active');
        }
        // Handle tutor statistics page
        else if (dataPage === 'tutor-statistics' && currentPage === '/ts.html') {
          item.classList.add('active');
        }
        // Handle learner statistics page
        else if (dataPage === 'learner-statistics' && currentPage === '/ls.html') {
          item.classList.add('active');
        }
      });
    }

    // Initialize active state
    setActiveNavItem();

    // Update active state when navigating
    window.addEventListener('popstate', setActiveNavItem);
  </script>
</body>
</html>
