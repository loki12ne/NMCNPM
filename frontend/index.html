<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      margin-left: 200px;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
    }

    h1 { 
      text-align: center; 
      font-size: 48px;
      font-weight: 600;
      color: #2a3f80;
      margin-bottom: 48px;
    }

    .search-upload-container {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 32px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 20px;
      color: #89CFF0;
      font-size: 20px;
      z-index: 1;
    }

    #searchInput { 
      width: 100%;
      padding: 20px 20px 20px 60px;
      border: 2px solid #a2b8fa;
      border-radius: 12px;
      background-color: #ffffff;
      outline: none;
      font-size: 16px;
      color: #2a3f80;
      transition: all 0.3s ease;
    }

    #searchInput:focus {
      border-color: #557cf2;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 127, 255, 0.1);
    }

    #searchInput::placeholder {
      color: #d9e2ff;
    }

    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background: #557cf2;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .upload-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 127, 255, 0.4);
    }

    .auth-buttons { 
      position: absolute; 
      top: 20px; 
      right: 20px; 
      display: flex; 
      gap: 12px; 
    }

    .auth-btn {
      padding: 12px 20px;
      border: 2px solid #557cf2;
      border-radius: 12px;
      font-size: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    /* Login button - white background, blue text */
    #loginBtn {
      background: #557cf2;
      color: white;
      border-color: #557cf2;
    }

    #loginBtn:hover {
      background: #7997f2;
      color: #f0f4ff;
      border-color: #7997f2;
    }
    
    /* Signup button - blue background, white text */  
    #signupBtn {
      /* background-color: white; */
      color: #557cf2;
      border-color: #557cf2;
    }

    #signupBtn:hover {
      background: #7997f2;
      color: #f0f4ff;
      border-color: #7997f2;
    }

    .logout-btn {
      background: white;
      color: #557cf2;
      border-color: #557cf2;
      font-size: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .logout-btn:hover {
      background: #7997f2;
      color: #f0f4ff;
    }

    .tutor-upgrade-btn {
      background: #557cf2;
      color: white;
      border-color: #557cf2;
      font-size: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .tutor-upgrade-btn:hover {
      background: #7997f2;
      color: #f0f4ff;
      border-color: #7997f2;
    }

    .hidden { 
      display: none; 
    }

    /* Welcome message for authenticated users */
    .welcome-section {
      text-align: center;
      margin-bottom: 32px;
      background: linear-gradient(135deg, #557cf2 0%, #89CFF0 100%);  /*#ffffff*/;
      padding: 20px;
      border-radius: 12px;
      color: #2a3f80;
    }

    .welcome-text {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 8px;
    }

    .user-name {
      font-size: 24px;
      font-weight: 600;
      color: white;
    }

    .questions { 
      display: grid; 
      gap: 16px;
      width: 100%;
    }

    .question-card { 
      background-color: white; 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 2px 8px rgba(0, 127, 255, 0.1);
      border: 1px solid #f0f4ff;
      transition: all 0.3s ease;
    }

    .question-card:hover {
      box-shadow: 0 8px 25px rgba(0, 127, 255, 0.15);
      border-color: #a1caf1;
      transform: translateY(-2px);
    }

    .question-card .meta { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 12px; 
    }

    .question-card .meta .likes { 
      display: flex;
      align-items: center;
      gap: 4px;
      color: #007fff; 
      font-weight: 600;
      font-size: 14px;
    }

    .heart-icon {
      width: 20px;
      height: 20px;
      background-color: #a1caf1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #003399;
    }

    .question-card .meta .comments { 
      display: flex;
      align-items: center;
      gap: 4px;
      color: #89CFF0;
      font-size: 14px;
    }

    .comment-icon {
      width: 20px;
      height: 20px;
      background-color: #f0f4ff;
      border: 1px solid #a1caf1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #003399; 
    }

    .question-card .details { 
      margin-bottom: 12px; 
    }

    .question-card .details .subject { 
      background-color: #f0f4ff; 
      border: 1px solid #a1caf1;
      padding: 6px 12px; 
      border-radius: 12px; 
      font-size: 12px;
      font-weight: 500;
      color: #003399;
      display: inline-block;
      margin-right: 12px;
      margin-bottom: 8px;
    }

    .question-card .details .title { 
      font-weight: 600;
      color: #003399;
      font-size: 16px;
      line-height: 1.5;
      word-wrap: break-word;
      max-width: 100%;
    }

    .question-card .info { 
      color: #89CFF0; 
      font-size: 14px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .user-icon {
      color: #a1caf1;
      font-size: 16px;
    }

    .like-btn {
      background-color: #f0f4ff;
      color: #003399;
      border: 1px solid #a1caf1;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .like-btn:hover {
      background-color: #007fff;
      color: white;
      border-color: #007fff;
    }

    @media (max-width: 768px) {
      body {
        margin-left: 70px;
        padding: 16px;
      }

      h1 {
        font-size: 36px;
        margin-bottom: 32px;
      }

      .search-upload-container {
        flex-direction: column;
        gap: 20px;
      }

      .upload-btn {
        width: 100%;
        max-width: 600px;
        height: 50px;
        border-radius: 8px;
      }

      .auth-buttons {
        position: relative;
        top: auto;
        right: auto;
        justify-content: center;
        margin-bottom: 20px;
      }

      .container {
        padding: 20px;
        min-height: 50vh;
      }
    }
  </style>
</head>
<body>
  <!-- Include Sidebar -->
  <div id="sidebar-container"></div>

  <div class="auth-buttons">
    <a href="/login.html" id="loginBtn" class="auth-btn">Login</a>
    <a href="/signup.html" id="signupBtn" class="auth-btn">Sign Up</a>
    <button class="auth-btn tutor-upgrade-btn" id="tutorUpgradeBtn">Tutor upgrade</button>
    <button id="logoutBtn" class="auth-btn logout-btn hidden">Log out</button>
  </div>

  <div class="container">
    <div class="welcome-section hidden" id="welcomeSection">
      <div class="welcome-text">Welcome back,</div>
      <div class="user-name" id="userName">Student</div>
    </div>

    <h1>Home</h1>
    
    <div class="search-upload-container">
      <div class="search-wrapper">
        <span class="search-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#clip0_5016_4389)">
              <path d="M22.2929 23.7071C22.6834 24.0976 23.3166 24.0976 23.7071 23.7071C24.0976 23.3166 24.0976 22.6834 23.7071 22.2929L22.2929 23.7071ZM18.1176 10.0588C18.1176 14.5096 14.5096 18.1176 10.0588 18.1176V20.1176C15.6142 20.1176 20.1176 15.6142 20.1176 10.0588H18.1176ZM10.0588 18.1176C5.60806 18.1176 2 14.5096 2 10.0588H0C0 15.6142 4.50349 20.1176 10.0588 20.1176V18.1176ZM2 10.0588C2 5.60806 5.60806 2 10.0588 2V0C4.50349 0 0 4.50349 0 10.0588H2ZM10.0588 2C14.5096 2 18.1176 5.60806 18.1176 10.0588H20.1176C20.1176 4.50349 15.6142 0 10.0588 0V2ZM15.8223 17.2365L22.2929 23.7071L23.7071 22.2929L17.2365 15.8223L15.8223 17.2365Z" fill="#557cf2"/>
            </g>
            <defs>
              <clipPath id="clip0_5016_4389">
                <rect width="24" height="24" fill="white"/>
              </clipPath>
            </defs>
          </svg>
        </span>
        <input type="text" id="searchInput" placeholder="Search for questions, topics, or subjects..." />
      </div>
      <a href="/post-question.html" class="upload-btn" id="uploadBtn" title="Post a new question">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

        </svg>
      </a>
    </div>

    <div class="questions" id="questions">
      <!-- Question cards will be dynamically loaded here -->
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    // Load sidebar
    fetch('/sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        // Execute sidebar scripts
        const sidebarScripts = document.getElementById('sidebar-container').querySelectorAll('script');
        sidebarScripts.forEach(script => {
          const newScript = document.createElement('script');
          newScript.textContent = script.textContent;
          document.head.appendChild(newScript);
        });
      })
      .catch(error => console.error('Error loading sidebar:', error));

    async function checkAuth() {
      try {
        const res = await fetch(`${BASE_URL}/auth/check-auth`, {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const tutorUpgradeBtn = document.getElementById('tutorUpgradeBtn');
        const welcomeSection = document.getElementById('welcomeSection');
        const userName = document.getElementById('userName');

        if (data.isAuthenticated) {
          loginBtn.classList.add('hidden');
          signupBtn.classList.add('hidden');
          logoutBtn.classList.remove('hidden');
          tutorUpgradeBtn.classList.remove('hidden');
          welcomeSection.classList.remove('hidden');

          // Set user name if available
          if (data.user && data.user.username) {
            userName.textContent = data.user.username;
          }

          // Change Tutor Upgrade button for admin
          if (data.user && data.user.role === 'admin') {
            tutorUpgradeBtn.textContent = 'Tutor request';
            tutorUpgradeBtn.onclick = function() {
              window.location.href = '/manage-tutor-requests.html';
            };
          } else {
            tutorUpgradeBtn.textContent = 'Tutor upgrade';
            tutorUpgradeBtn.onclick = function() {
              window.location.href = '/tutor-request.html';
            };
          }
        } else {
          loginBtn.classList.remove('hidden');
          signupBtn.classList.remove('hidden');
          logoutBtn.classList.add('hidden');
          tutorUpgradeBtn.classList.add('hidden');
          welcomeSection.classList.add('hidden');
        }
      } catch (err) {
        console.error('Auth check error:', err);
      }
    }

    async function logout() {
      try {
        const res = await fetch(`${BASE_URL}/auth/logout`, {
          method: 'POST',
          credentials: 'include'
        });
        const data = await res.json();
        if (res.ok) {
          window.location.reload();
        } else {
          alert(`Error: ${data.error}`);
        }
      } catch (err) {
        console.error('Logout error:', err);
        alert('Network error');
      }
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const searchTerm = this.value.trim();
        if (searchTerm) {
          // Redirect to a search results page or implement search logic
          console.log('Searching for:', searchTerm);
          // You can implement search functionality here
          // For example: window.location.href = `/search?q=${encodeURIComponent(searchTerm)}`;
        }
      }
    });

    window.onload = () => {
      checkAuth();
      document.getElementById('logoutBtn').addEventListener('click', logout);
      // tutorUpgradeBtn onclick is set in checkAuth based on role
      loadQuestions();
    };

    async function loadQuestions() {
      try {
        const res = await fetch(`${BASE_URL}/questions`, {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        const questionsContainer = document.getElementById('questionsContainer');

        if (data && data.questions && data.questions.length > 0) {
          data.questions.forEach(question => {
            const questionCard = document.createElement('div');
            questionCard.className = 'question-card';
            questionCard.innerHTML = `
              <div class="meta">
                <div class="likes">
                  <span class="heart-icon">❤️</span>
                  ${question.likes}
                </div>
                <div class="comments">
                  <span class="comment-icon">💬</span>
                  ${question.comments}
                </div>
              </div>
              <div class="details">
                <span class="subject">${question.subject}</span>
                <h2 class="title">${question.title}</h2>
              </div>
              <div class="info">
                <div class="user-info">
                  <span class="user-icon">👤</span>
                  ${question.username}
                </div>
                <div class="date">
                  ${new Date(question.createdAt).toLocaleDateString()}
                </div>
              </div>
            `;
            questionsContainer.appendChild(questionCard);
          });
        } else {
          questionsContainer.innerHTML = '<p>No questions found.</p>';
        }
      } catch (err) {
        console.error('Error loading questions:', err);
      }
    }
  </script>
</body>
</html>
