<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANDA - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Main Content */
    .main-content {
      margin-left: 200px;
      padding: 32px;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      color: #2a3f80;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .header-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: #557cf2;
      color: white;
    }

    .btn-primary:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(85, 124, 242, 0.3);
    }

    .btn-secondary {
      background: white;
      color: #557cf2;
      border: 2px solid #557cf2;
    }

    .btn-secondary:hover {
      background: #557cf2;
      color: white;
    }

    /* Dashboard Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 24px;
      margin-bottom: 32px;
    }

    .widget {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
      transition: all 0.3s ease;
    }

    .widget:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    /* Line Chart Widget */
    .line-chart-widget {
      grid-column: 1;
      grid-row: 1;
    }

    .chart-container {
      width: 100%;
      height: 200px;
      margin-top: 16px;
      position: relative;
    }

    /* Pie Chart Widget */
    .pie-chart-widget {
      grid-column: 2;
      grid-row: 1;
    }

    /* Top 10 Widget */
    .top-tutors-widget {
      grid-column: 3;
      grid-row: 1 / 3;
    }

    .top-list {
      margin-top: 16px;
    }

    .top-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }

    .top-item:last-child {
      border-bottom: none;
    }

    .rank-number {
      width: 24px;
      font-weight: 700;
      color: #557cf2;
    }

    .username {
      flex: 1;
      color: #374151;
    }

    .dropdown-container {
      margin-top: 20px;
    }

    .dropdown {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }

    /* New Questions Widget */
    .new-questions-widget {
      grid-column: 1;
      grid-row: 2;
    }

    .questions-stats {
      display: flex;
      gap: 32px;
      margin-top: 16px;
    }

    .stat-item {
      text-align: center;
      flex: 1;
    }

    .stat-label {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #2a3f80;
    }

    /* Productivity Chart Widget */
    .productivity-widget {
      grid-column: 2;
      grid-row: 2;
    }

    /* Bottom Actions */
    .bottom-actions {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 32px;
    }

    .action-card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      min-width: 200px;
    }

    .action-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .action-title {
      font-size: 18px;
      font-weight: 700;
      color: #2a3f80;
      margin-bottom: 8px;
    }

    .action-subtitle {
      font-size: 14px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* Widget Titles */
    .widget-title {
      font-size: 16px;
      font-weight: 600;
      color: #2a3f80;
      margin-bottom: 4px;
    }

    .widget-subtitle {
      font-size: 14px;
      color: #6b7280;
    }

    /* Responsive Design */
    @media (max-width: 1200px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto auto auto;
      }

      .line-chart-widget {
        grid-column: 1 / 3;
        grid-row: 1;
      }

      .pie-chart-widget {
        grid-column: 1;
        grid-row: 2;
      }

      .top-tutors-widget {
        grid-column: 2;
        grid-row: 2 / 4;
      }

      .new-questions-widget {
        grid-column: 1;
        grid-row: 3;
      }

      .productivity-widget {
        grid-column: 1 / 3;
        grid-row: 4;
      }
    }

    @media (max-width: 768px) {
      .main-content {
        margin-left: 70px;
        padding: 20px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .line-chart-widget,
      .pie-chart-widget,
      .top-tutors-widget,
      .new-questions-widget,
      .productivity-widget {
        grid-column: 1;
        grid-row: auto;
      }

      .questions-stats {
        flex-direction: column;
        gap: 16px;
      }

      .bottom-actions {
        flex-direction: column;
        align-items: center;
      }

      .action-card {
        width: 100%;
        max-width: 300px;
      }

      .header {
        flex-direction: column;
        gap: 16px;
        align-items: stretch;
      }

      .header-actions {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Include Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1 class="page-title">Overall Statistics</h1>
      <div class="header-actions">
        <button class="header-btn btn-primary" id="adminBtn">admin</button>
        <button class="header-btn btn-secondary" onclick="logout()">Log out</button>
      </div>
    </div>

    <!-- Dashboard Grid -->
    <div class="dashboard-grid">
      <!-- Line Chart Widget -->
      <div class="widget line-chart-widget">
        <div class="widget-title">Questions Over Time</div>
        <div class="widget-subtitle">Track question activity trends</div>
        <div class="chart-container">
          <canvas id="questionsChart"></canvas>
        </div>
      </div>

      <!-- Pie Chart Widget -->
      <div class="widget pie-chart-widget">
        <div class="widget-title">Question Status</div>
        <div class="widget-subtitle">Answered vs Unanswered</div>
        <div class="chart-container">
          <canvas id="statusChart"></canvas>
        </div>
      </div>

      <!-- Top 10 Tutors Widget -->
      <div class="widget top-tutors-widget">
        <div class="widget-title">Top 10</div>
        <div class="widget-subtitle">Most rated tutors</div>
        <div class="top-list" id="topTutorsList">
          <div class="top-item">
            <div class="rank-number">-</div>
            <div class="username">Loading...</div>
          </div>
        </div>
        <div class="dropdown-container">
          <select class="dropdown" id="timeFilter" onchange="updateTopTutorsByFilter()">
            <option value="today">Today</option>
            <option value="week">This Week</option>
            <option value="month">This Month</option>
            <option value="year">This Year</option>
          </select>
        </div>
      </div>

      <!-- New Questions Widget -->
      <div class="widget new-questions-widget">
        <div class="widget-title">New Questions</div>
        <div class="widget-subtitle">Recent activity</div>
        <div class="questions-stats">
          <div class="stat-item">
            <div class="stat-label">By learners</div>
            <div class="stat-value" id="learnerQuestions">0</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">By tutors</div>
            <div class="stat-value" id="tutorQuestions">0</div>
          </div>
        </div>
      </div>

      <!-- Productivity Widget -->
      <div class="widget productivity-widget">
        <div class="widget-title">User Productivity</div>
        <div class="widget-subtitle">Activity comparison</div>
        <div class="chart-container">
          <canvas id="productivityChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Bottom Actions -->
    <div class="bottom-actions">
      <a href="/learner-statistics.html" class="action-card">
        <div class="action-title">LEARNERS</div>
        <div class="action-subtitle">Statistics</div>
      </a>
      <a href="/tutor-statistics.html" class="action-card">
        <div class="action-title">TUTORS</div>
        <div class="action-subtitle">Statistics</div>
      </a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    // Load sidebar
    function loadSidebar() {
      fetch('/sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar-container').innerHTML = data;
          // Execute sidebar scripts
          const sidebarScripts = document.getElementById('sidebar-container').querySelectorAll('script');
          sidebarScripts.forEach(script => {
            const newScript = document.createElement('script');
            newScript.textContent = script.textContent;
            document.head.appendChild(newScript);
          });
          // Set active state for admin page
          setTimeout(() => {
            const adminNavItem = document.querySelector('[data-page="admin"]');
            if (adminNavItem) {
              // Remove active from all items
              document.querySelectorAll('.nav-item, .user-item').forEach(item => {
                item.classList.remove('active');
              });
              // Add active to admin item
              adminNavItem.classList.add('active');
            }
          }, 100);
        })
        .catch(error => console.error('Error loading sidebar:', error));
    }

    // Chart variables
    let questionsChart, statusChart, productivityChart;

    // Initialize charts
    function initializeCharts() {
      // Questions Over Time Chart
      const questionsCtx = document.getElementById('questionsChart').getContext('2d');
      questionsChart = new Chart(questionsCtx, {
        type: 'line',
        data: {
          labels: ['Loading...'],
          datasets: [{
            label: 'Questions',
            data: [0],
            borderColor: '#557cf2',
            backgroundColor: 'rgba(85, 124, 242, 0.1)',
            borderWidth: 3,
            fill: true,
            tension: 0.4,
            pointBackgroundColor: '#557cf2',
            pointBorderColor: '#ffffff',
            pointBorderWidth: 2,
            pointRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: '#f3f4f6'
              },
              ticks: {
                color: '#6b7280'
              }
            },
            x: {
              grid: {
                color: '#f3f4f6'
              },
              ticks: {
                color: '#6b7280'
              }
            }
          }
        }
      });

      // Question Status Pie Chart
      const statusCtx = document.getElementById('statusChart').getContext('2d');
      statusChart = new Chart(statusCtx, {
        type: 'doughnut',
        data: {
          labels: ['Answered', 'Unanswered'],
          datasets: [{
            data: [0, 0],
            backgroundColor: ['#557cf2', '#e5e7eb'],
            borderWidth: 0,
            cutout: '60%'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                padding: 20,
                usePointStyle: true,
                color: '#374151'
              }
            }
          }
        }
      });

      // Productivity Bar Chart
      const productivityCtx = document.getElementById('productivityChart').getContext('2d');
      productivityChart = new Chart(productivityCtx, {
        type: 'bar',
        data: {
          labels: ['Learners', 'Tutors'],
          datasets: [{
            label: 'Activity Score',
            data: [0, 0],
            backgroundColor: ['#89CFF0', '#557cf2'],
            borderRadius: 8,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 100,
              grid: {
                color: '#f3f4f6'
              },
              ticks: {
                color: '#6b7280'
              }
            },
            x: {
              grid: {
                display: false
              },
              ticks: {
                color: '#6b7280'
              }
            }
          }
        }
      });
    }

    // Authentication check
    async function checkAuth() {
      try {
        const res = await fetch(`${BASE_URL}/auth/check-auth`, {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        
        if (!data.isAuthenticated) {
          window.location.href = '/login.html';
          return;
        }

        // Check if user is admin
        if (!data.user || data.user.role !== 'admin') {
          // Redirect based on role
          if (data.user.role === 'learner') {
            window.location.href = '/learner.html';
          } else if (data.user.role === 'tutor') {
            window.location.href = '/tutor.html';
          } else {
            window.location.href = '/login.html';
          }
          return;
        }

        // Load dashboard data
        loadDashboardData();
      } catch (err) {
        console.error('Auth check error:', err);
        window.location.href = '/login.html';
      }
    }

    // Logout function
    async function logout() {
      try {
        const res = await fetch(`${BASE_URL}/auth/logout`, {
          method: 'POST',
          credentials: 'include'
        });
        
        if (res.ok) {
          window.location.href = '/index.html';
        } else {
          alert('Error logging out');
        }
      } catch (err) {
        console.error('Logout error:', err);
        alert('Network error during logout');
      }
    }

    // Load dashboard data
    async function loadDashboardData() {
      try {
        // Load statistics data
        await Promise.all([
          loadQuestionStats(),
          loadUserStats(),
          loadTopTutors(),
          loadNewQuestions(),
          loadQuestionStatus()
        ]);
      } catch (err) {
        console.error('Error loading dashboard data:', err);
      }
    }

    // Load question statistics
    async function loadQuestionStats() {
      try {
        const res = await fetch(`${BASE_URL}/statistics/questions-over-time`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            // Update questions over time chart
            updateQuestionsOverTimeChart(data);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch questions over time:', res.status);
        }
      } catch (err) {
        console.error('Error loading question stats:', err);
      }
    }

    // Load user statistics
    async function loadUserStats() {
      try {
        const res = await fetch(`${BASE_URL}/statistics/user-productivity`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            // Update productivity chart
            updateProductivityChart(data);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch user productivity:', res.status);
        }
      } catch (err) {
        console.error('Error loading user stats:', err);
      }
    }

    // Load top tutors
    async function loadTopTutors() {
      try {
        const timeFilter = document.getElementById('timeFilter')?.value || 'month';
        const res = await fetch(`${BASE_URL}/statistics/top-tutors?timeFilter=${timeFilter}`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            // Update top tutors list
            updateTopTutors(data);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch top tutors:', res.status);
        }
      } catch (err) {
        console.error('Error loading top tutors:', err);
      }
    }

    // Load new questions statistics
    async function loadNewQuestions() {
      try {
        const res = await fetch(`${BASE_URL}/statistics/new-questions`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            // Update new questions counts
            updateNewQuestionsCounts(data);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch new questions:', res.status);
        }
      } catch (err) {
        console.error('Error loading new questions:', err);
      }
    }

    // Load question status statistics
    async function loadQuestionStatus() {
      try {
        const res = await fetch(`${BASE_URL}/statistics/question-status`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            // Update question status chart
            updateQuestionStatusChart(data);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch question status:', res.status);
        }
      } catch (err) {
        console.error('Error loading question status:', err);
      }
    }

    // Update questions over time chart
    function updateQuestionsOverTimeChart(data) {
      if (questionsChart && data.labels && data.data) {
        questionsChart.data.labels = data.labels;
        questionsChart.data.datasets[0].data = data.data;
        questionsChart.update();
      } else {
        console.warn('Questions chart data is incomplete:', data);
      }
    }

    // Update question status chart
    function updateQuestionStatusChart(data) {
      if (statusChart && data.answered !== undefined && data.unanswered !== undefined) {
        statusChart.data.datasets[0].data = [data.answered, data.unanswered];
        statusChart.update();
      } else {
        console.warn('Question status chart data is incomplete:', data);
      }
    }

    // Update productivity chart
    function updateProductivityChart(data) {
      if (productivityChart && data.learners !== undefined && data.tutors !== undefined) {
        productivityChart.data.datasets[0].data = [data.learners, data.tutors];
        productivityChart.update();
      } else {
        console.warn('Productivity chart data is incomplete:', data);
      }
    }

    // Update new questions counts
    function updateNewQuestionsCounts(data) {
      const learnerStat = document.getElementById('learnerQuestions');
      const tutorStat = document.getElementById('tutorQuestions');
      
      if (learnerStat) learnerStat.textContent = data.byLearners || 0;
      if (tutorStat) tutorStat.textContent = data.byTutors || 0;
    }



    // Update top tutors
    function updateTopTutors(data) {
      if (data.tutors && Array.isArray(data.tutors)) {
        const topList = document.getElementById('topTutorsList');
        if (topList) {
          topList.innerHTML = data.tutors.slice(0, 10).map((tutor, index) => `
            <div class="top-item">
              <div class="rank-number">${index + 1}</div>
              <div class="username">${tutor.username}</div>
            </div>
          `).join('');
        }
      }
    }

    // Update top tutors based on time filter
    function updateTopTutorsByFilter() {
      loadTopTutors();
    }

    // Initialize dashboard
    window.onload = function() {
      loadSidebar();
      checkAuth();
      // Initialize charts after a short delay to ensure canvas elements are ready
      setTimeout(() => {
        initializeCharts();
      }, 100);
    };

    // Add loading state management
    function showLoading() {
      // Show loading indicators if needed
      console.log('Loading dashboard data...');
    }

    function hideLoading() {
      // Hide loading indicators if needed
      console.log('Dashboard data loaded');
    }
  </script>
</body>
</html>
