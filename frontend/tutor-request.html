<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký làm gia sư</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff /*linear-gradient(135deg, #557cf2 0%, #d94c4c 100%)*/;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #557cf2;
      margin-bottom: 8px;
    }

    .header p {
      color: #6b7280;
      font-size: 16px;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #557cf2;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .back-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 127, 255, 0.4);
    }

    .form-container {
      padding: 32px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .form-group input[type="text"],
.form-group input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #a1caf1;
      border-radius: 90px;
      font-size: 1.2vw;
      font-family: 'Inter', sans-serif;
      background: #fff;
      transition: box-shadow 0.2s;
      outline: none;
    }

    .form-group input[type="text"]:focus,
.form-group input[type="number"]:focus {
      border-color: #557cf2;
      background: #f0f4ff;
      box-shadow: 0 0 0 0px #557cf2;
    }

    .file-upload-group {
      position: relative;
    }

    .file-upload-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .file-upload-input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-upload-display {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      border: 2px solid #a1caf1;
      border-radius: 12px;
      background-color: #f0f4ff;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .file-upload-display:hover {
      border-color: #557cf2;
      background-color: #fff;
    }

    .file-upload-display.has-file {
      border-color: #059669;
      background-color: #ecfdf5;
    }

    .file-upload-content {
      text-align: center;
      color: #2a3f80;
    }

    .file-upload-icon {
      font-size: 24px;
      margin-bottom: 8px;
      display: block;
    }

    .file-upload-text {
      font-size: 14px;
      font-weight: 500;
    }

    .file-upload-subtext {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #557cf2;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 127, 255, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .result {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .result.error {
      background-color: #fed7d7;
      color: #c53030;
      border: 1px solid #feb2b2;
    }

    .result.success {
      background-color: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }

    .hidden {
      display: none;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .container {
        margin: 0;
        border-radius: 0;
        min-height: 100vh;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
      }

      .form-container {
        padding: 24px;
      }

      .header {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/index.html" class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 12.75C20.4142 12.75 20.75 12.4142 20.75 12C20.75 11.5858 20.4142 11.25 20 11.25V12.75ZM4 11.25C3.58579 11.25 3.25 11.5858 3.25 12C3.25 12.4142 3.58579 12.75 4 12.75V11.25ZM7.47204 17.5327C7.76624 17.8243 8.24111 17.8222 8.53269 17.528C8.82427 17.2338 8.82216 16.7589 8.52796 16.4673L7.47204 17.5327ZM6.23703 15.2527L6.76499 14.72H6.76499L6.23703 15.2527ZM6.23703 8.74731L5.70907 8.21462H5.70907L6.23703 8.74731ZM8.52796 7.53269C8.82216 7.24111 8.82428 6.76624 8.53269 6.47204C8.24111 6.17784 7.76624 6.17573 7.47204 6.46731L8.52796 7.53269ZM4.01989 12.3133L3.27591 12.4082L3.27591 12.4082L4.01989 12.3133ZM4.01989 11.6867L3.27591 11.5918L3.27591 11.5918L4.01989 11.6867ZM20 11.25H4V12.75H20V11.25ZM8.52796 16.4673L6.76499 14.72L5.70907 15.7854L7.47204 17.5327L8.52796 16.4673ZM6.76499 9.28L8.52796 7.53269L7.47204 6.46731L5.70907 8.21462L6.76499 9.28ZM6.76499 14.72C6.0495 14.0109 5.55869 13.5228 5.22659 13.1093C4.904 12.7076 4.79332 12.4496 4.76387 12.2185L3.27591 12.4082C3.35469 13.0263 3.64963 13.5412 4.05706 14.0485C4.45498 14.544 5.01863 15.1011 5.70907 15.7854L6.76499 14.72ZM5.70907 8.21462C5.01863 8.89892 4.45498 9.45597 4.05706 9.95146C3.64963 10.4588 3.3547 10.9737 3.27591 11.5918L4.76387 11.7815C4.79332 11.5504 4.904 11.2924 5.22659 10.8907C5.55869 10.4772 6.0495 9.98914 6.76499 9.28L5.70907 8.21462ZM4.76387 12.2185C4.74538 12.0734 4.74538 11.9266 4.76387 11.7815L3.27591 11.5918C3.24136 11.8629 3.24136 12.1371 3.27591 12.4082L4.76387 12.2185Z" fill="#ffffff" stroke="#ffffff" stroke-width="0.5"/>
      </svg>
    </a>
    <div class="header">
      <h1>Đăng ký làm gia sư</h1>
      <p>Điền thông tin để trở thành gia sư</p>
    </div>
    
    <div class="form-container">
      <form id="tutorRequestForm" enctype="multipart/form-data">
        <div class="form-group">
          <label for="full_name">Họ và tên *</label>
          <input type="text" id="full_name" name="full_name" required>
        </div>

        <div class="form-group">
          <label for="university">Trường đại học *</label>
          <input type="text" id="university" name="university" required>
        </div>

        <div class="form-group">
          <label for="faculty">Khoa/ngành *</label>
          <input type="text" id="faculty" name="faculty" required>
        </div>

        <div class="form-group">
          <label for="year">Năm vào trường *</label>
          <input type="number" id="year" name="year" min="2000" max="2030" required>
        </div>

        <div class="form-group file-upload-group">
          <label>Ảnh thẻ sinh viên *</label>
          <div class="file-upload-wrapper">
            <input type="file" id="student_card_image" name="student_card_image" accept="image/*" required class="file-upload-input">
            <div class="file-upload-display" id="fileDisplay">
              <div class="file-upload-content">
                <span class="file-upload-icon">📄</span>
                <div class="file-upload-text">Chọn ảnh thẻ sinh viên</div>
                <div class="file-upload-subtext">PNG, JPG lên đến 5MB</div>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Đăng ký làm gia sư
        </button>
      </form>
      
      <div id="result" class="result hidden"></div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script>
  // File upload display functionality
  const fileInput = document.getElementById('student_card_image');
  const fileDisplay = document.getElementById('fileDisplay');
  
  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const fileSize = (file.size / 1024 / 1024).toFixed(2);
      fileDisplay.classList.add('has-file');
      fileDisplay.innerHTML = `
        <div class="file-upload-content">
          <span class="file-upload-icon">✅</span>
          <div class="file-upload-text">${file.name}</div>
          <div class="file-upload-subtext">Kích thước: ${fileSize}MB</div>
        </div>
      `;
    } else {
      fileDisplay.classList.remove('has-file');
      fileDisplay.innerHTML = `
        <div class="file-upload-content">
          <span class="file-upload-icon">📄</span>
          <div class="file-upload-text">Chọn ảnh thẻ sinh viên</div>
          <div class="file-upload-subtext">PNG, JPG lên đến 5MB</div>
        </div>
      `;
    }
  });

  // Form submission
  document.getElementById('tutorRequestForm').onsubmit = async function(e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const submitBtn = document.getElementById('submitBtn');
    const result = document.getElementById('result');
    
    // Validate file size
    const file = fileInput.files[0];
    if (file && file.size > 5 * 1024 * 1024) {
      showResult('Kích thước file quá lớn. Vui lòng chọn file nhỏ hơn 5MB.', 'error');
      return;
    }
    
    // Show loading state
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="loading"></span>Đang xử lý...';
    result.className = 'result hidden';
    
    // Get username from session or localStorage if available
    let username = localStorage.getItem('username') || 'student1';
    formData.append('username', username);

    try {
      const res = await fetch(`${BASE_URL}/api/tutor-request`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      
      if (res.ok) {
        showResult(data.message, 'success');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1200);
        form.reset();
        // Reset file display
        fileDisplay.classList.remove('has-file');
        fileDisplay.innerHTML = `
          <div class="file-upload-content">
            <span class="file-upload-icon">📄</span>
            <div class="file-upload-text">Chọn ảnh thẻ sinh viên</div>
            <div class="file-upload-subtext">PNG, JPG lên đến 5MB</div>
          </div>
        `;
      } else {
        showResult(data.error || 'Đã xảy ra lỗi', 'error');
      }
    } catch (error) {
      console.error('Error:', error);
      showResult('Lỗi kết nối. Vui lòng thử lại.', 'error');
    } finally {
      // Reset button state
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Đăng ký làm gia sư';
    }
  };

  function showResult(message, type) {
    const result = document.getElementById('result');
    result.textContent = message;
    result.className = `result ${type}`;
    
    // Auto-hide success message after 5 seconds
    if (type === 'success') {
      setTimeout(() => {
        result.className = 'result hidden';
      }, 5000);
    }
  }

  // Drag and drop functionality
  fileDisplay.addEventListener('dragover', function(e) {
    e.preventDefault();
    this.style.borderColor = '#557cf2';
    this.style.backgroundColor = '#f0f4ff';
  });

  fileDisplay.addEventListener('dragleave', function(e) {
    e.preventDefault();
    this.style.borderColor = '#d1d5db';
    this.style.backgroundColor = '#f9fafb';
  });

  fileDisplay.addEventListener('drop', function(e) {
    e.preventDefault();
    this.style.borderColor = '#d1d5db';
    this.style.backgroundColor = '#f9fafb';
    
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      const file = files[0];
      if (file.type.startsWith('image/')) {
        fileInput.files = files;
        // Trigger change event
        const event = new Event('change', { bubbles: true });
        fileInput.dispatchEvent(event);
      } else {
        showResult('Vui lòng chọn file ảnh (PNG, JPG).', 'error');
      }
    }
  });
  </script>
</body>
</html>
