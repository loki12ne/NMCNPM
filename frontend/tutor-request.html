<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutor Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      color: #557cf2;
      margin-bottom: 8px;
    }

    .header p {
      color: #6b7280;
      font-size: 16px;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #557cf2;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .back-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 127, 255, 0.4);
    }

    .form-container {
      padding: 32px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .form-group input[type="text"],
    .form-group input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #a1caf1;
      border-radius: 90px;
      font-size: 1.2vw;
      font-family: 'Inter', sans-serif;
      background: #fff;
      transition: box-shadow 0.2s;
      outline: none;
    }

    .form-group input[type="text"]:focus,
    .form-group input[type="number"]:focus {
      border-color: #557cf2;
      background: #f0f4ff;
      box-shadow: 0 0 0 0px #557cf2;
    }

    .file-upload-group {
      position: relative;
    }

    .file-upload-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .file-upload-input {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-upload-display {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      border: 2px solid #a1caf1;
      border-radius: 12px;
      background-color: #f0f4ff;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .file-upload-display:hover {
      border-color: #557cf2;
      background-color: #fff;
    }

    .file-upload-display.has-file {
      border-color: #059669;
      background-color: #ecfdf5;
    }

    .file-upload-content {
      text-align: center;
      color: #2a3f80;
    }

    .file-upload-icon {
      font-size: 24px;
      margin-bottom: 8px;
      display: block;
    }

    .file-upload-text {
      font-size: 14px;
      font-weight: 500;
    }

    .file-upload-subtext {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: #557cf2;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 127, 255, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .result {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .result.error {
      background-color: #fed7d7;
      color: #c53030;
      border: 1px solid #feb2b2;
    }

    .result.success {
      background-color: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }

    .hidden {
      display: none;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      .container {
        margin: 0;
        border-radius: 0;
        min-height: 100vh;
      }

      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
      }

      .form-container {
        padding: 24px;
      }

      .header {
        padding: 24px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/index.html" class="back-btn">
      <!-- Back Icon -->
      <svg width="24" height="24" ...>...</svg>
    </a>
    <div class="header">
      <h1>Tutor Registration</h1>
      <p>Fill in your information to become a tutor</p>
    </div>
    
    <div class="form-container">
      <form id="tutorRequestForm" enctype="multipart/form-data">
        <div class="form-group">
          <label for="full_name">Full Name *</label>
          <input type="text" id="full_name" name="full_name" required>
        </div>

        <div class="form-group">
          <label for="university">University *</label>
          <input type="text" id="university" name="university" required>
        </div>

        <div class="form-group">
          <label for="faculty">Faculty/Major *</label>
          <input type="text" id="faculty" name="faculty" required>
        </div>

        <div class="form-group">
          <label for="year">Year of Admission *</label>
          <input type="number" id="year" name="year" min="2000" max="2030" required>
        </div>

        <div class="form-group file-upload-group">
          <label>Student ID Card Image *</label>
          <div class="file-upload-wrapper">
            <input type="file" id="student_card_image" name="student_card_image" accept="image/*" required class="file-upload-input">
            <div class="file-upload-display" id="fileDisplay">
              <div class="file-upload-content">
                <span class="file-upload-icon">📄</span>
                <div class="file-upload-text">Choose student ID card image</div>
                <div class="file-upload-subtext">PNG, JPG up to 5MB</div>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Register as Tutor
        </button>
      </form>
      
      <div id="result" class="result hidden"></div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script>
  // File upload display
  const fileInput = document.getElementById('student_card_image');
  const fileDisplay = document.getElementById('fileDisplay');
  
  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const fileSize = (file.size / 1024 / 1024).toFixed(2);
      fileDisplay.classList.add('has-file');
      fileDisplay.innerHTML = `
        <div class="file-upload-content">
          <span class="file-upload-icon">✅</span>
          <div class="file-upload-text">${file.name}</div>
          <div class="file-upload-subtext">Size: ${fileSize}MB</div>
        </div>
      `;
    } else {
      fileDisplay.classList.remove('has-file');
      fileDisplay.innerHTML = `
        <div class="file-upload-content">
          <span class="file-upload-icon">📄</span>
          <div class="file-upload-text">Choose student ID card image</div>
          <div class="file-upload-subtext">PNG, JPG up to 5MB</div>
        </div>
      `;
    }
  });

  // Form submission
  document.getElementById('tutorRequestForm').onsubmit = async function(e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    const submitBtn = document.getElementById('submitBtn');
    const result = document.getElementById('result');
    
    // Validate file size
    const file = fileInput.files[0];
    if (file && file.size > 5 * 1024 * 1024) {
      showResult('File size too large. Please choose a file smaller than 5MB.', 'error');
      return;
    }
    
    // Loading state
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="loading"></span>Processing...';
    result.className = 'result hidden';
    
    let username = localStorage.getItem('username') || 'learner';
    formData.append('username', username);

    try {
      const res = await fetch(`${BASE_URL}/api/tutor-request`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      
      if (res.ok) {
        showResult(data.message, 'success');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1200);
        form.reset();
        fileDisplay.classList.remove('has-file');
        fileDisplay.innerHTML = `
          <div class="file-upload-content">
            <span class="file-upload-icon">📄</span>
            <div class="file-upload-text">Choose student ID card image</div>
            <div class="file-upload-subtext">PNG, JPG up to 5MB</div>
          </div>
        `;
      } else {
        showResult(data.error || 'An error occurred', 'error');
      }
    } catch (error) {
      console.error('Error:', error);
      showResult('Connection error. Please try again.', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Register as Tutor';
    }
  };

  function showResult(message, type) {
    const result = document.getElementById('result');
    result.textContent = message;
    result.className = `result ${type}`;
    
    if (type === 'success') {
      setTimeout(() => {
        result.className = 'result hidden';
      }, 5000);
    }
  }

  // Drag and drop
  fileDisplay.addEventListener('dragover', function(e) {
    e.preventDefault();
    this.style.borderColor = '#557cf2';
    this.style.backgroundColor = '#f0f4ff';
  });

  fileDisplay.addEventListener('dragleave', function(e) {
    e.preventDefault();
    this.style.borderColor = '#d1d5db';
    this.style.backgroundColor = '#f9fafb';
  });

  fileDisplay.addEventListener('drop', function(e) {
    e.preventDefault();
    this.style.borderColor = '#d1d5db';
    this.style.backgroundColor = '#f9fafb';
    
    const files = e.dataTransfer.files;
    if (files.length > 0) {
      const file = files[0];
      if (file.type.startsWith('image/')) {
        fileInput.files = files;
        const event = new Event('change', { bubbles: true });
        fileInput.dispatchEvent(event);
      } else {
        showResult('Please choose an image file (PNG, JPG).', 'error');
      }
    }
  });
  </script>
</body>
</html>
