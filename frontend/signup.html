<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #f0f4ff;
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow-x: hidden;
    }
    .container {
      width: 100vw;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
      box-sizing: border-box;
    }
    .title {
      font-family: 'Inter', sans-serif;
      font-style: normal;
      font-weight: 700;
      font-size: 4vw;
      line-height: 1.2;
      color: #2a3f80;
      margin: 0 0 2vw 0;
      text-align: center;
    }
    .form-group {
      width: 100%;
      max-width: 700px;
      margin-bottom: 2vw;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .form-group label {
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 2vw;
      line-height: 1.2;
      color: #2a3f80;
      margin-bottom: 0.5vw;
    }
    .form-group input {
      width: 100%;
      min-width: 0;
      height: 4vw;
      min-height: 48px;
      border-radius: 90px;
      border: none;
      padding: 0 2vw;
      font-family: 'Inter', sans-serif;
      font-size: 1.2vw;
      color: #2a3f80;
      outline: none;
      box-sizing: border-box;
      background: #ffffff !important;
      background-color: #ffffff !important;
      transition: box-shadow 0.2s;
    }
    .form-group input:focus {
      box-shadow: 0 0 0 2px #557cf2;
    }
    .form-group input:-webkit-autofill,
    .form-group input:-webkit-autofill:hover,
    .form-group input:-webkit-autofill:focus,
    .form-group input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
      -webkit-text-fill-color: #2a3f80 !important;
    }
    .button-group {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: row;
      gap: 2vw;
      justify-content: flex-start;
      margin-top: 2vw;
    }
    .btn-signup {
      flex: 1 1 0;
      min-width: 160px;
      height: 4vw;
      min-height: 60px;
      background: #557cf2;
      border-radius: 90px;
      border: none;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1.5vw;
      color: #f0f4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
      text-align: center;
    }
    .btn-signup:hover {
      background: #7997f2;
    }
    .btn-login {
      flex: 1 1 0;
      min-width: 160px;
      height: 4vw;
      min-height: 60px;
      background: transparent;
      border: 2px solid #557cf2;
      border-radius: 90px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1.5vw;
      color: #557cf2;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    .btn-login:hover {
      background: #7997f2;
      border-color: #7997f2;
      color: #f0f4ff;
    }
    .btn-home {
      flex: 1 1 0;
      min-width: 160px;
      height: 4vw;
      min-height: 60px;
      background: transparent;
      border: 2px solid #a1caf1;
      border-radius: 90px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1.5vw;
      color: #2a3f80;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }
    .btn-home:hover {
      background: #a1caf1;
      color: #003399;
    }
    #result {
      margin-top: 2vw;
      font-size: 1vw;
      color: #ff4444;
      text-align: center;
      width: 100%;
      max-width: 700px;
      z-index: 10;
    }
    #result.success {
      color: #22c55e;
    }
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #557cf2;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .back-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 127, 255, 0.4);
    }

    @media (max-width: 900px) {
      .title { font-size: 7vw; }
      .form-group label { font-size: 4vw; }
      .form-group input { font-size: 3vw; height: 8vw; }
      .btn-signup, .btn-login { font-size: 3vw; height: 8vw; }
      .btn-home { font-size: 3vw; height: 8vw; }
      .button-group { gap: 4vw; }
    }
    @media (max-width: 600px) {
      .container { padding: 0 0.5rem; }
      .title { font-size: 9vw; }
      .form-group, .button-group { max-width: 100%; }
      .form-group label { font-size: 5vw; }
      .form-group input { font-size: 4vw; height: 12vw; }
      .btn-signup, .btn-login { font-size: 4vw; height: 12vw; min-width: 0; }
      .btn-home { font-size: 4vw; height: 12vw; min-width: 0; }
      #result { font-size: 3vw; }
      .back-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 100;
      }
    }
  </style>
</head>
<body>
  <a href="/index.html" class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 12.75C20.4142 12.75 20.75 12.4142 20.75 12C20.75 11.5858 20.4142 11.25 20 11.25V12.75ZM4 11.25C3.58579 11.25 3.25 11.5858 3.25 12C3.25 12.4142 3.58579 12.75 4 12.75V11.25ZM7.47204 17.5327C7.76624 17.8243 8.24111 17.8222 8.53269 17.528C8.82427 17.2338 8.82216 16.7589 8.52796 16.4673L7.47204 17.5327ZM6.23703 15.2527L6.76499 14.72H6.76499L6.23703 15.2527ZM6.23703 8.74731L5.70907 8.21462H5.70907L6.23703 8.74731ZM8.52796 7.53269C8.82216 7.24111 8.82428 6.76624 8.53269 6.47204C8.24111 6.17784 7.76624 6.17573 7.47204 6.46731L8.52796 7.53269ZM4.01989 12.3133L3.27591 12.4082L3.27591 12.4082L4.01989 12.3133ZM4.01989 11.6867L3.27591 11.5918L3.27591 11.5918L4.01989 11.6867ZM20 11.25H4V12.75H20V11.25ZM8.52796 16.4673L6.76499 14.72L5.70907 15.7854L7.47204 17.5327L8.52796 16.4673ZM6.76499 9.28L8.52796 7.53269L7.47204 6.46731L5.70907 8.21462L6.76499 9.28ZM6.76499 14.72C6.0495 14.0109 5.55869 13.5228 5.22659 13.1093C4.904 12.7076 4.79332 12.4496 4.76387 12.2185L3.27591 12.4082C3.35469 13.0263 3.64963 13.5412 4.05706 14.0485C4.45498 14.544 5.01863 15.1011 5.70907 15.7854L6.76499 14.72ZM5.70907 8.21462C5.01863 8.89892 4.45498 9.45597 4.05706 9.95146C3.64963 10.4588 3.3547 10.9737 3.27591 11.5918L4.76387 11.7815C4.79332 11.5504 4.904 11.2924 5.22659 10.8907C5.55869 10.4772 6.0495 9.98914 6.76499 9.28L5.70907 8.21462ZM4.76387 12.2185C4.74538 12.0734 4.74538 11.9266 4.76387 11.7815L3.27591 11.5918C3.24136 11.8629 3.24136 12.1371 3.27591 12.4082L4.76387 12.2185Z" fill="#ffffff" stroke="#ffffff" stroke-width="0.5"/>
      </svg>
  </a>
  <div class="container">
    <h1 class="title">Sign up</h1>
    <form id="signupForm">
      <div class="form-group username">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" required />
      </div>
      <div class="form-group password">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <div class="button-group">
        <button type="submit" class="btn-signup">Sign up</button>
        <a href="/login.html" class="btn-login">Log in</a>
      </div>
    </form>
    <p id="result"></p>
  </div>
  <script src="/js/config.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const result = document.getElementById('result');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const username = form.username.value.trim();
      const password = form.password.value.trim();
      if (!username || !password) {
        result.textContent = 'Please fill in all fields';
        result.className = '';
        return;
      }
      try {
        const res = await fetch(`${BASE_URL}/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include'
        });
        const data = await res.json();
        if (res.ok) {
          result.textContent = 'Sign up successful! Redirecting to login...';
          result.className = 'success';
          setTimeout(() => window.location.href = '/login.html', 1000);
        } else {
          result.textContent = `Error: ${data.error}`;
          result.className = '';
        }
      } catch (err) {
        result.textContent = 'Network error: Unable to connect to server';
        result.className = '';
        console.error('Fetch error:', err);
      }
    });
  </script>
</body>
</html>
