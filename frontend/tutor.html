<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutor Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      margin-left: 200px;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .welcome-card {
      background: linear-gradient(135deg, #6fa8f5 0%, #4a90e2 100%);
      color: white;
      padding: 20px 32px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(79, 144, 226, 0.3);
    }

    .welcome-text {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      opacity: 0.9;
    }

    .user-id {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .auth-buttons { 
      display: flex; 
      gap: 12px; 
    }

    .auth-btn {
      padding: 12px 20px;
      border: 2px solid #557cf2;
      border-radius: 12px;
      font-size: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .tutor-upgrade-btn {
      background: #557cf2;
      color: white;
      border-color: #557cf2;
    }

    .tutor-upgrade-btn:hover {
      background: #7997f2;
      border-color: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(85, 124, 242, 0.4);
    }

    .logout-btn {
      background: white;
      color: #557cf2;
      border-color: #557cf2;
    }

    .logout-btn:hover {
      background: #557cf2;
      color: white;
    }

    h1 { 
      text-align: center; 
      font-size: 48px;
      font-weight: 600;
      color: #2a3f80;
      margin-bottom: 48px;
    }

    .search-upload-container {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      margin-bottom: 48px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 20px;
      color: #89CFF0;
      font-size: 20px;
      z-index: 1;
    }

    #searchInput { 
      width: 100%;
      padding: 20px 20px 20px 60px;
      border: 2px solid #a2b8fa;
      border-radius: 12px;
      background-color: #ffffff;
      outline: none;
      font-size: 16px;
      color: #2a3f80;
      transition: all 0.3s ease;
    }

    #searchInput:focus {
      border-color: #557cf2;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 127, 255, 0.1);
    }

    #searchInput::placeholder {
      color: #d9e2ff;
    }

    .post-question-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      background: #557cf2;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .post-question-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 127, 255, 0.4);
    }

    .questions-container {
      width: 100%;
    }

    .questions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding: 0 4px;
    }

    .questions-title {
      font-size: 28px;
      font-weight: 600;
      color: #2a3f80;
    }

    .questions-count {
      background: #a1caf1;
      color: #003399;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .questions { 
      display: grid; 
      gap: 20px;
      width: 100%;
    }

    .question-card { 
      background-color: white; 
      padding: 24px; 
      border-radius: 16px; 
      box-shadow: 0 4px 12px rgba(0, 127, 255, 0.08);
      border: 1px solid #f0f4ff;
      transition: all 0.3s ease;
    }

    .question-card:hover {
      box-shadow: 0 12px 32px rgba(0, 127, 255, 0.15);
      border-color: #a1caf1;
      transform: translateY(-4px);
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .meta-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .likes {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #007fff;
      font-weight: 600;
      font-size: 14px;
    }

    .heart-icon {
      width: 24px;
      height: 24px;
      background-color: #a1caf1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #003399;
    }

    .comments {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #89CFF0;
      font-size: 14px;
    }

    .comment-icon {
      width: 24px;
      height: 24px;
      background-color: #f0f4ff;
      border: 1px solid #a1caf1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #003399;
    }

    .subject-tag { 
      background-color: #f0f4ff; 
      border: 1px solid #a1caf1;
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 13px;
      font-weight: 600;
      color: #003399;
      display: inline-block;
    }

    .question-content {
      margin-bottom: 16px;
    }

    .question-title { 
      font-weight: 600;
      color: #2a3f80;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .question-text {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
    }

    .question-info { 
      color: #89CFF0; 
      font-size: 14px;
      display: flex;
      gap: 20px;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid #e6f2ff;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-icon {
      color: #a1caf1;
      font-size: 16px;
    }

    .question-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
    }

    .answer-btn {
      background: #557cf2;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .answer-btn:hover {
      background: #7997f2;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(85, 124, 242, 0.4);
    }

    .no-questions {
      text-align: center;
      padding: 60px 20px;
      color: #89CFF0;
      font-size: 18px;
    }

    .error {
      background: #fff5f5;
      color: #e53e3e;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #fed7d7;
      text-align: center;
      font-weight: 500;
    }

    @media (max-width: 768px) {
      body {
        margin-left: 70px;
        padding: 16px;
      }

      .container {
        padding: 20px 16px;
      }

      .header {
        flex-direction: column;
        gap: 20px;
        align-items: stretch;
      }

      h1 {
        font-size: 36px;
        margin-bottom: 32px;
      }

      .search-upload-container {
        flex-direction: column;
        gap: 20px;
      }

      .post-question-btn {
        width: 100%;
        height: 50px;
        border-radius: 8px;
      }

      .questions-header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      .question-card {
        padding: 20px;
      }

      .question-meta {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      .meta-right {
        align-self: flex-end;
      }

      .question-footer {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }

      .question-info {
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <!-- Include Sidebar -->
  <div id="sidebar-container"></div>

  <div class="container">
    <div class="header">
      <div class="welcome-card">
        <div class="welcome-text">Welcome back</div>
        <div class="user-id" id="userId">Loading...</div>
      </div>

      
    </div>

    <h1>Home</h1>
    
    <div class="search-upload-container">
      <div class="search-wrapper">
        <span class="search-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
            <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2"/>
          </svg>
        </span>
        <input type="text" id="searchInput" placeholder="Search for questions to answer..." />
      </div>
      <a href="/post-question.html" class="post-question-btn" title="Post a new question">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    <div class="questions-container">
      <div class="questions-header">
        <h2 class="questions-title">Unanswered Questions</h2>
        <div class="questions-count" id="questionsCount">0 questions</div>
      </div>
      
      <div class="questions" id="questions">
        <!-- Questions will be loaded here -->
      </div>
      
      <p id="result"></p>
    </div>
  </div>

  <script>
    const BASE_URL = 'http://localhost:3000';

    // Load sidebar
    fetch('/sidebar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('sidebar-container').innerHTML = data;
        // Execute sidebar scripts
        const sidebarScripts = document.getElementById('sidebar-container').querySelectorAll('script');
        sidebarScripts.forEach(script => {
          const newScript = document.createElement('script');
          newScript.textContent = script.textContent;
          document.head.appendChild(newScript);
        });
      })
      .catch(error => console.error('Error loading sidebar:', error));

    /**
     * Check authentication and redirect if needed
     */
    async function checkAuth() {
      try {
        const res = await fetch(`${BASE_URL}/auth/check-auth`, {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        
        if (!data.isAuthenticated) {
          window.location.href = '/login.html';
          return;
        }

        // Check role and redirect if not appropriate for this page
        if (data.user && data.user.role === 'learner') {
          window.location.href = '/learner.html';
          return;
        } else if (data.user && data.user.role === 'admin') {
          window.location.href = '/admin.html';
          return;
        } else if (!data.user || data.user.role !== 'tutor') {
          // If not tutor, learner, or admin, redirect to login
          window.location.href = '/login.html';
          return;
        }

        // Update user ID in welcome card
        document.getElementById('userId').textContent = data.user.username || data.user.user_id || 'Tutor';

        return data;
      } catch (err) {
        console.error('Auth check error:', err);
        window.location.href = '/login.html';
      }
    }

    /**
     * Logout function
     */
    async function logout() {
      try {
        const res = await fetch(`${BASE_URL}/auth/logout`, {
          method: 'POST',
          credentials: 'include'
        });
        if (res.ok) window.location.href = '/index.html';
      } catch (err) {
        console.error('Logout error:', err);
      }
    }

    /**
     * Load questions - only show unanswered questions for tutors
     */
    async function loadQuestions() {
      try {
        const res = await fetch(`${BASE_URL}/questions`, {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        const questionsDiv = document.getElementById('questions');
        const questionsCount = document.getElementById('questionsCount');
        questionsDiv.innerHTML = '';

        if (res.ok && data.questions) {
          // Filter out questions that already have answers
          const unansweredQuestions = [];
          
          for (const q of data.questions) {
            try {
              const answerRes = await fetch(`${BASE_URL}/questions/answer/${q.question_id}`, { 
                credentials: 'include' 
              });
              
              // Only include questions that don't have answers (404 or empty response)
              if (!answerRes.ok) {
                unansweredQuestions.push(q);
              } else {
                const answerData = await answerRes.json();
                if (!answerData || !answerData.text_content) {
                  unansweredQuestions.push(q);
                }
              }
            } catch (err) {
              // If there's an error checking for answers, include the question
              unansweredQuestions.push(q);
            }
          }

          const questionCount = unansweredQuestions.length;
          questionsCount.textContent = `${questionCount} question${questionCount !== 1 ? 's' : ''}`;

          if (questionCount === 0) {
            questionsDiv.innerHTML = '<div class="no-questions">All questions have been answered! 🎉</div>';
            return;
          }

          // Display only unanswered questions
          unansweredQuestions.forEach(q => {
            const div = document.createElement('div');
            div.className = 'question-card';

            div.innerHTML = `
              <div class="question-meta">
                <div class="meta-left">
                  <span class="subject-tag">${q.subject}</span>
                </div>
                <div class="meta-right">
                  <div class="likes">
                    <span class="heart-icon">❤️</span>
                    ${q.likes || q.so_luot_like || 0}
                  </div>
                  <div class="comments">
                    <span class="comment-icon">💬</span>
                    ${q.comments || q.so_luot_comment || 0}
                  </div>
                </div>
              </div>
              <div class="question-content">
                <h3 class="question-title">${q.title || 'Question'}</h3>
                <p class="question-text">${q.text_content}</p>
              </div>
              <div class="question-footer">
                <div class="question-info">
                  <div class="user-info">
                    <span class="user-icon">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M20.5899 22C20.5899 18.13 16.7399 15 11.9999 15C7.25991 15 3.40991 18.13 3.40991 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </span>
                    ${q.username}
                  </div>
                  <div class="date">
                    ${new Date(q.date_posted).toLocaleDateString()}
                  </div>
                </div>
                <a href="/answer.html?question_id=${q.question_id}" class="answer-btn">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 12H16M12 8V16M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  Answer Question
                </a>
              </div>
            `;
            questionsDiv.appendChild(div);
          });
        } else {
          questionsCount.textContent = '0 questions';
          questionsDiv.innerHTML = `<div class="error">Server error: ${data.error || 'Unknown error'}</div>`;
        }
      } catch (err) {
        document.getElementById('questions').innerHTML = '<div class="error">Network error or server unavailable</div>';
        document.getElementById('questionsCount').textContent = '0 questions';
        console.error('Fetch error:', err);
      }
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        const searchTerm = this.value.trim();
        if (searchTerm) {
          console.log('Searching for:', searchTerm);
          // TODO: Implement search functionality
        }
      }
    });

    window.onload = async () => {
      await checkAuth();
      loadQuestions();
    };
  </script>
</body>
</html>
