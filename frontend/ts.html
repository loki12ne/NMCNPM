<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANDA - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Main Content */
    .main-content {
      margin-left: 200px;
      padding: 32px;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      color: #2a3f80;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .header-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    
    .btn-secondary {
      background: white;
      color: #557cf2;
      border: 2px solid #557cf2;
    }

    .btn-secondary:hover {
      background: #557cf2;
      color: white;
    }

    /* Dashboard Grid */
    .dashboard-grid {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    /* Section Header */
    .section-header {
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e5e7eb;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: #2a3f80;
      letter-spacing: 1px;
    }

    .widget {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
      transition: all 0.3s ease;
    }

    .widget:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    /* Stats Widget */
    .stats-widget {
      flex: 0 0 300px;
    }

    .stat-number {
      font-size: 48px;
      font-weight: 700;
      color: #2a3f80;
      margin: 8px 0;
      line-height: 1;
    }

    /* Chart Widget */
    .chart-widget {
      flex: 1;
      min-width: 400px;
    }

    .chart-container {
      width: 100%;
      height: 200px;
      margin-top: 16px;
      position: relative;
    }

    /* Tutors List Widget */
    .tutors-list-widget {
      width: 100%;
      margin-top: 24px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f3f4f6;
    }

    .filter-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .filter-btn {
      background: #f3f4f6;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      color: #6b7280;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      background: #e5e7eb;
      color: #374151;
    }

    .filter-dropdown {
      background: #9ca3af;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .tutors-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .tutor-item {
      display: flex;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .tutor-item:last-child {
      border-bottom: none;
    }

    .tutor-avatar {
      margin-right: 16px;
    }

    .avatar-circle {
      width: 40px;
      height: 40px;
      background: #374151;
      border-radius: 50%;
    }

    .tutor-name {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .tutor-status {
      font-size: 14px;
      color: #6b7280;
    }

    /* Widget Titles */
    .widget-title {
      font-size: 16px;
      font-weight: 600;
      color: #2a3f80;
      margin-bottom: 4px;
    }

    .widget-subtitle {
      font-size: 14px;
      color: #6b7280;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .main-content {
        margin-left: 70px;
        padding: 20px;
      }

      .dashboard-grid {
        flex-direction: column;
        gap: 16px;
      }

      .header {
        flex-direction: column;
        gap: 16px;
        align-items: stretch;
      }

      .header-actions {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Include Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1 class="page-title">Overall Statistics</h1>
      <div class="header-actions">
        <button class="header-btn btn-secondary" onclick="logout()">Log out</button>
      </div>
    </div>

    <!-- Section Title -->
    <div class="section-header">
      <h2 class="section-title">TUTOR STATISTICS</h2>
    </div>

    <!-- Dashboard Grid -->
    <div class="dashboard-grid">
      <!-- Current Tutors Widget -->
      <div class="widget stats-widget">
        <div class="widget-title">Current tutors</div>
        <div class="stat-number" id="currentTutors">0</div>
        <div class="widget-title" style="margin-top: 20px;">Tutor approvals</div>
        <div class="stat-number" id="tutorApprovals">0</div>
      </div>

      <!-- Bar Chart Widget -->
      <div class="widget chart-widget">
        <div class="widget-title">New Replies by Tutors by Day</div>
        <div class="chart-container">
          <canvas id="tutorsChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Tutors List Widget -->
    <div class="widget tutors-list-widget">
      <div class="list-header">
        <div class="widget-title">Tutors list</div>
        <div class="filter-controls">
          <button class="filter-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 4.6C3 4.03995 3 3.75992 3.10899 3.54601C3.20487 3.35785 3.35785 3.20487 3.54601 3.10899C3.75992 3 4.03995 3 4.6 3H19.4C19.9601 3 20.2401 3 20.454 3.10899C20.6422 3.20487 20.7951 3.35785 20.891 3.54601C21 3.75992 21 4.03995 21 4.6V6.33726C21 6.58185 21 6.70414 20.9724 6.81923C20.9479 6.92127 20.9075 7.01881 20.8526 7.10828C20.7908 7.2092 20.7043 7.29568 20.5314 7.46863L14.4686 13.5314C14.2957 13.7043 14.2092 13.7908 14.1474 13.8917C14.0925 13.9812 14.0521 14.0787 14.0276 14.1808C14 14.2959 14 14.4182 14 14.6627V17L10 21V14.6627C10 14.4182 10 14.2959 9.97237 14.1808C9.94787 14.0787 9.90747 13.9812 9.85264 13.8917C9.7908 13.7908 9.70432 13.7043 9.53137 13.5314L3.46863 7.46863C3.29568 7.29568 3.2092 7.2092 3.14736 7.10828C3.09253 7.01881 3.05213 6.92127 3.02763 6.81923C3 6.70414 3 6.58185 3 6.33726V4.6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <select class="filter-dropdown" id="tutorFilter" onchange="handleTutorFilterChange()">
            <option value="recently-active">Recently active</option>
            <option value="all">All tutors</option>
            <option value="new">New tutors</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div class="tutors-list" id="tutorsList">
        <!-- Tutor list will be loaded dynamically -->
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    // Load sidebar
    function loadSidebar() {
      fetch('/admin-sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar-container').innerHTML = data;
          // Execute sidebar scripts
          const sidebarScripts = document.getElementById('sidebar-container').querySelectorAll('script');
          sidebarScripts.forEach(script => {
            const newScript = document.createElement('script');
            newScript.textContent = script.textContent;
            document.head.appendChild(newScript);
          });
          // Set active state for tutor statistics page
          setTimeout(() => {
            const tutorStatsNavItem = document.querySelector('[data-page="tutor-statistics"]');
            if (tutorStatsNavItem) {
              // Remove active from all items
              document.querySelectorAll('.nav-item, .user-item').forEach(item => {
                item.classList.remove('active');
              });
              // Add active to tutor statistics item
              tutorStatsNavItem.classList.add('active');
            }
          }, 100);
        })
        .catch(error => console.error('Error loading sidebar:', error));
    }

    // Chart variables
    let tutorsChart;

    // Initialize charts
    function initializeCharts() {
      // Tutors Replies Bar Chart
      const tutorsCtx = document.getElementById('tutorsChart').getContext('2d');
      tutorsChart = new Chart(tutorsCtx, {
        type: 'bar',
        data: {
          labels: ['...'],
          datasets: [{
            label: 'New Replies',
            data: [0],
            backgroundColor: '#557cf2',
            borderColor: '#557cf2',
            borderWidth: 1,
            borderRadius: 6,
            borderSkipped: false,
            maxBarThickness: 40
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 25,
              grid: {
                color: '#f3f4f6'
              },
              ticks: {
                color: '#6b7280',
                stepSize: 5
              }
            },
            x: {
              grid: {
                display: false
              },
              ticks: {
                color: '#6b7280'
              }
            }
          }
        }
      });
    }

    // Authentication check
    async function checkAuth() {
      try {
        console.log('Checking authentication...');
        const res = await fetch(`${BASE_URL}/auth/check-auth`, {
          method: 'GET',
          credentials: 'include'
        });
        console.log('Auth response status:', res.status);
        const data = await res.json();
        console.log('Auth response data:', data);
        
        if (!data.isAuthenticated) {
          console.log('User not authenticated, redirecting to login');
          window.location.href = '/login.html';
          return;
        }

        // Check if user is admin
        if (!data.user || data.user.role !== 'admin') {
          console.log('User role:', data.user?.role, 'Expected: admin');
          // Redirect based on role
          if (data.user?.role === 'learner') {
            window.location.href = '/learner.html';
          } else if (data.user?.role === 'tutor') {
            window.location.href = '/tutor.html';
          } else {
            window.location.href = '/login.html';
          }
          return;
        }

        console.log('User authenticated as admin, loading dashboard...');
        // Load dashboard data
        loadDashboardData();
      } catch (err) {
        console.error('Auth check error:', err);
        window.location.href = '/login.html';
      }
    }

    // Logout function
    async function logout() {
      try {
        const res = await fetch(`${BASE_URL}/auth/logout`, {
          method: 'POST',
          credentials: 'include'
        });
        
        if (res.ok) {
          window.location.href = '/index.html';
        } else {
          alert('Error logging out');
        }
      } catch (err) {
        console.error('Logout error:', err);
        alert('Network error during logout');
      }
    }

    // Load dashboard data
    async function loadDashboardData() {
      try {
        console.log('Loading dashboard data...');
        // Load statistics data
        await Promise.all([
          loadTutorOverview(),
          loadTutorRepliesPerDay(),
          loadTutorsList()
        ]);
        console.log('Dashboard data loaded successfully');
      } catch (err) {
        console.error('Error loading dashboard data:', err);
      }
    }

    // Load tutor overview statistics
    async function loadTutorOverview() {
      try {
        const res = await fetch(`${BASE_URL}/tutor-statistics/overview`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            updateTutorOverview(data.overview);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch tutor overview:', res.status);
        }
      } catch (err) {
        console.error('Error loading tutor overview:', err);
      }
    }

    // Load tutor replies per day statistics
    async function loadTutorRepliesPerDay() {
      try {
        const res = await fetch(`${BASE_URL}/tutor-statistics/replies-per-day`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            updateTutorChart(data);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch replies per day:', res.status);
        }
      } catch (err) {
        console.error('Error loading replies per day:', err);
      }
    }

    // Load tutors list
    async function loadTutorsList() {
      try {
        const filter = document.getElementById('tutorFilter')?.value || 'recently-active';
        const res = await fetch(`${BASE_URL}/tutor-statistics/list?filter=${filter}`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            updateTutorsList(data.tutors);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch tutors list:', res.status);
        }
      } catch (err) {
        console.error('Error loading tutors list:', err);
      }
    }

    // Update tutor overview with real data
    function updateTutorOverview(overview) {
      const currentTutorsEl = document.getElementById('currentTutors');
      const tutorApprovalsEl = document.getElementById('tutorApprovals');
      
      if (currentTutorsEl) currentTutorsEl.textContent = overview.totalTutors || 0;
      if (tutorApprovalsEl) tutorApprovalsEl.textContent = overview.pendingApprovals || 0;
    }

    // Update tutor chart with real data
    function updateTutorChart(data) {
      if (data.repliesPerDay && tutorsChart) {
        tutorsChart.data.labels = data.repliesPerDay.labels || ['...'];
        tutorsChart.data.datasets[0].data = data.repliesPerDay.data || [0];
        tutorsChart.update();
      }
    }

    // Update tutors list with real data
    function updateTutorsList(tutors) {
      const tutorsListEl = document.getElementById('tutorsList');
      if (tutorsListEl && Array.isArray(tutors)) {
        if (tutors.length === 0) {
          tutorsListEl.innerHTML = '<div class="tutor-item"><div class="tutor-info"><div class="tutor-name">No tutors found</div></div></div>';
          return;
        }
        
        tutorsListEl.innerHTML = tutors.map(tutor => `
          <div class="tutor-item" onclick="goToEvaluation('${tutor.username}')" style="cursor: pointer;">
            <div class="tutor-avatar">
              <div class="avatar-circle">${tutor.username.charAt(0).toUpperCase()}</div>
            </div>
            <div class="tutor-info">
              <div class="tutor-name">${tutor.username}</div>
              <div class="tutor-status">${tutor.status}</div>
            </div>
          </div>
        `).join('');
      }
    }

    // Navigate to evaluation page
    function goToEvaluation(username) {
      window.location.href = `/evaluate.html?tutor=${encodeURIComponent(username)}`;
    }

    // Handle tutor filter change
    function handleTutorFilterChange() {
      loadTutorsList();
    }

    // Initialize dashboard
    window.onload = function() {
      loadSidebar();
      checkAuth();
      // Initialize charts after a short delay to ensure canvas elements are ready
      setTimeout(() => {
        initializeCharts();
      }, 100);
    };
  </script>
</body>
</html>
