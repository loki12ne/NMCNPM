<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANDA - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Main Content */
    .main-content {
      margin-left: 200px;
      padding: 32px;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      color: #2a3f80;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .header-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-secondary {
      background: white;
      color: #557cf2;
      border: 2px solid #557cf2;
    }

    .btn-secondary:hover {
      background: #557cf2;
      color: white;
    }

    /* Dashboard Grid */
    .dashboard-grid {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    /* Section Header */
    .section-header {
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 2px solid #e5e7eb;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: #2a3f80;
      letter-spacing: 1px;
    }

    .widget {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
      transition: all 0.3s ease;
    }

    .widget:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    /* Stats Widget */
    .stats-widget {
      flex: 0 0 300px;
    }

    /* Line Chart Widget */
    .line-chart-widget {
      grid-column: 1;
      grid-row: 1;
    }

    .chart-container {
      width: 100%;
      height: 300px;
      margin-top: 16px;
      position: relative;
    }

    /* Chart Widget */
    .chart-widget {
      flex: 1;
      min-width: 400px;
    }

    .chart-container {
      width: 100%;
      height: 200px;
      margin-top: 16px;
      position: relative;
    }

    /* Pie Chart Widget */
    .stat-number {
      font-size: 48px;
      font-weight: 700;
      color: #2a3f80;
      margin: 8px 0;
      line-height: 1;
    }

    .pie-chart-widget {
      grid-column: 2;
      grid-row: 1;
    }

    /* Top 10 Widget */
    .top-tutors-widget {
      grid-column: 3;
      grid-row: 1 / 3;
    }

    /* Learners List Widget */
    .learners-list-widget {
      width: 100%;
      margin-top: 24px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f3f4f6;
    }

    .filter-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .filter-btn {
      background: #f3f4f6;
      border: none;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      color: #6b7280;
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      background: #e5e7eb;
      color: #374151;
    }

    .filter-dropdown {
      background: #9ca3af;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .learners-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .learner-item {
      display: flex;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .learner-item:last-child {
      border-bottom: none;
    }

    .learner-avatar {
      margin-right: 16px;
    }

    .avatar-circle {
      width: 40px;
      height: 40px;
      background: #374151;
      border-radius: 50%;
    }

    .learner-name {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 4px;
    }

    .learner-status {
      grid-column: 3;
      grid-row: 1 / 3;
    }

    .top-list {
      margin-top: 16px;
    }

    .top-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: 14px;
    }

    .top-item:last-child {
      border-bottom: none;
    }

    .rank-number {
      width: 24px;
      font-weight: 700;
      color: #557cf2;
    }

    .username {
      flex: 1;
      color: #374151;
    }

    .dropdown-container {
      margin-top: 20px;
    }

    .dropdown {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }

    /* New Questions Widget */
    .new-questions-widget {
      grid-column: 1;
      grid-row: 2;
    }

    .questions-stats {
      display: flex;
      gap: 32px;
      margin-top: 16px;
    }

    .stat-item {
      text-align: center;
      flex: 1;
    }

    .stat-label {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #2a3f80;
    }

    /* Productivity Chart Widget */
    .productivity-widget {
      grid-column: 2;
      grid-row: 2;
    }

    /* Bottom Actions */
    .bottom-actions {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 32px;
    }

    .action-card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      min-width: 200px;
    }

    .action-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .action-title {
      font-size: 18px;
      font-weight: 700;
      color: #2a3f80;
      margin-bottom: 8px;
    }

    .action-subtitle {
      font-size: 14px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    /* Widget Titles */
    .widget-title {
      font-size: 16px;
      font-weight: 600;
      color: #2a3f80;
      margin-bottom: 4px;
    }

    .widget-subtitle {
      font-size: 14px;
      color: #6b7280;
    }

    /* Responsive Design */
    @media (max-width: 1200px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto auto auto;
      }

      .line-chart-widget {
        grid-column: 1 / 3;
        grid-row: 1;
      }

      .pie-chart-widget {
        grid-column: 1;
        grid-row: 2;
      }

      .top-tutors-widget {
        grid-column: 2;
        grid-row: 2 / 4;
      }

      .new-questions-widget {
        grid-column: 1;
        grid-row: 3;
      }

      .productivity-widget {
        grid-column: 1 / 3;
        grid-row: 4;
      }
    }

    @media (max-width: 768px) {
      .main-content {
        margin-left: 70px;
        padding: 20px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .line-chart-widget,
      .pie-chart-widget,
      .top-tutors-widget,
      .new-questions-widget,
      .productivity-widget {
        grid-column: 1;
        grid-row: auto;
      }

      .questions-stats {
        flex-direction: column;
        gap: 16px;
      }

      .bottom-actions {
        flex-direction: column;
        align-items: center;
      }

      .action-card {
        width: 100%;
        max-width: 300px;
      }

      .header {
        flex-direction: column;
        gap: 16px;
        align-items: stretch;
      }

      .header-actions {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <!-- Include Sidebar -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1 class="page-title">Overall Statistics</h1>
      <div class="header-actions">
        <button class="header-btn btn-secondary" onclick="logout()">Log out</button>
      </div>
    </div>

    <!-- Section Title -->
    <div class="section-header">
      <h2 class="section-title">LEARNER STATISTICS</h2>
    </div>

    <!-- Dashboard Grid -->
    <div class="dashboard-grid">
      <!-- Current Learners Widget -->
      <div class="widget stats-widget">
        <div class="widget-title">Current learners</div>
        <div class="stat-number" id="currentLearners">0</div>
        <div class="widget-title" style="margin-top: 20px;">New learners today</div>
        <div class="stat-number" id="newLearnersToday">0</div>
      </div>

      <!-- Bar Chart Widget -->
      <div class="widget chart-widget">
        <div class="widget-title">New Questions by Learners by Day</div>
        <div class="chart-container">
          <canvas id="learnersChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Learners List Widget -->
    <div class="widget learners-list-widget">
      <div class="list-header">
        <div class="widget-title">Learners list</div>
        <div class="filter-controls">
          <button class="filter-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 4.6C3 4.03995 3 3.75992 3.10899 3.54601C3.20487 3.35785 3.35785 3.20487 3.54601 3.10899C3.75992 3 4.03995 3 4.6 3H19.4C19.9601 3 20.2401 3 20.454 3.10899C20.6422 3.20487 20.7951 3.35785 20.891 3.54601C21 3.75992 21 4.03995 21 4.6V6.33726C21 6.58185 21 6.70414 20.9724 6.81923C20.9479 6.92127 20.9075 7.01881 20.8526 7.10828C20.7908 7.2092 20.7043 7.29568 20.5314 7.46863L14.4686 13.5314C14.2957 13.7043 14.2092 13.7908 14.1474 13.8917C14.0925 13.9812 14.0521 14.0787 14.0276 14.1808C14 14.2959 14 14.4182 14 14.6627V17L10 21V14.6627C10 14.4182 10 14.2959 9.97237 14.1808C9.94787 14.0787 9.90747 13.9812 9.85264 13.8917C9.7908 13.7908 9.70432 13.7043 9.53137 13.5314L3.46863 7.46863C3.29568 7.29568 3.2092 7.2092 3.14736 7.10828C3.09253 7.01881 3.05213 6.92127 3.02763 6.81923C3 6.70414 3 6.58185 3 6.33726V4.6Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <select class="filter-dropdown" id="learnerFilter" onchange="handleLearnerFilterChange()">
            <option value="all">All learners</option>            
            <option value="recently-active">Recently active</option>
            <option value="new">New learners</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div class="learners-list" id="learnersList">
        <!-- Learner list will be loaded dynamically -->
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script>
    // Load sidebar
    function loadSidebar() {
      fetch('/admin-sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar-container').innerHTML = data;
          // Execute sidebar scripts
          const sidebarScripts = document.getElementById('sidebar-container').querySelectorAll('script');
          sidebarScripts.forEach(script => {
            const newScript = document.createElement('script');
            newScript.textContent = script.textContent;
            document.head.appendChild(newScript);
          });
          // Set active state for learner statistics page
          setTimeout(() => {
            const learnerStatsNavItem = document.querySelector('[data-page="learner-statistics"]');
            if (learnerStatsNavItem) {
              // Remove active from all items
              document.querySelectorAll('.nav-item, .user-item').forEach(item => {
                item.classList.remove('active');
              });
              // Add active to learner statistics item
              learnerStatsNavItem.classList.add('active');
            }
          }, 100);
        })
        .catch(error => console.error('Error loading sidebar:', error));
    }

    // Chart variables
    let questionsChart, statusChart, productivityChart;

    // Initialize charts
    function initializeCharts() {
      // Learners Questions Bar Chart
      const learnersCtx = document.getElementById('learnersChart').getContext('2d');
      questionsChart = new Chart(learnersCtx, {
        type: 'bar',
        data: {
          labels: ['Loading...'],
          datasets: [{
            label: 'New Questions',
            data: [0],
            backgroundColor: '#557cf2',
            borderColor: '#557cf2',
            borderWidth: 1,
            borderRadius: 6,
            borderSkipped: false,
            maxBarThickness: 40
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: '#f3f4f6'
              },
              ticks: {
                color: '#6b7280'
              }
            },
            x: {
              grid: {
                display: false
              },
              ticks: {
                color: '#6b7280'
              }
            }
          }
        }
      });
    }

    // Authentication check
    async function checkAuth() {
      try {
        const res = await fetch(`${BASE_URL}/auth/check-auth`, {
          method: 'GET',
          credentials: 'include'
        });
        const data = await res.json();
        
        if (!data.isAuthenticated) {
          window.location.href = '/login.html';
          return;
        }

        // Check if user is admin
        if (!data.user || data.user.role !== 'admin') {
          // Redirect based on role
          if (data.user.role === 'learner') {
            window.location.href = '/learner.html';
          } else if (data.user.role === 'tutor') {
            window.location.href = '/tutor.html';
          } else {
            window.location.href = '/login.html';
          }
          return;
        }

        // Load dashboard data
        loadDashboardData();
      } catch (err) {
        console.error('Auth check error:', err);
        window.location.href = '/login.html';
      }
    }

    // Logout function
    async function logout() {
      try {
        const res = await fetch(`${BASE_URL}/auth/logout`, {
          method: 'POST',
          credentials: 'include'
        });
        
        if (res.ok) {
          window.location.href = '/index.html';
        } else {
          alert('Error logging out');
        }
      } catch (err) {
        console.error('Logout error:', err);
        alert('Network error during logout');
      }
    }

    // Load dashboard data
    async function loadDashboardData() {
      try {
        // Load statistics data
        await Promise.all([
          loadLearnerOverview(),
          loadLearnerQuestionsPerDay(),
          loadLearnersList()
        ]);
      } catch (err) {
        console.error('Error loading dashboard data:', err);
      }
    }

    // Load learner overview statistics
    async function loadLearnerOverview() {
      try {
        const res = await fetch(`${BASE_URL}/learner-statistics/overview`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            updateLearnerOverview(data.overview);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch learner overview:', res.status);
        }
      } catch (err) {
        console.error('Error loading learner overview:', err);
      }
    }

    // Load learner questions per day statistics
    async function loadLearnerQuestionsPerDay() {
      try {
        const res = await fetch(`${BASE_URL}/learner-statistics/questions-per-day`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            updateLearnerChart(data);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch questions per day:', res.status);
        }
      } catch (err) {
        console.error('Error loading questions per day:', err);
      }
    }

    // Load learners list
    async function loadLearnersList() {
      try {
        const filter = document.getElementById('learnerFilter')?.value || 'recently-active';
        const res = await fetch(`${BASE_URL}/learner-statistics/list?filter=${filter}`, {
          credentials: 'include'
        });
        
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            updateLearnersList(data.learners);
          } else {
            console.error('API returned error:', data.error);
          }
        } else {
          console.error('Failed to fetch learners list:', res.status);
        }
      } catch (err) {
        console.error('Error loading learners list:', err);
      }
    }

    // Update learner overview with real data
    function updateLearnerOverview(overview) {
      const currentLearnersEl = document.getElementById('currentLearners');
      const newLearnersTodayEl = document.getElementById('newLearnersToday');
      
      if (currentLearnersEl) currentLearnersEl.textContent = overview.totalLearners || 0;
      if (newLearnersTodayEl) newLearnersTodayEl.textContent = overview.activeLearnersToday || 0;
    }

    // Update learner chart with real data
    function updateLearnerChart(data) {
      if (data.questionsPerDay && questionsChart) {
        questionsChart.data.labels = data.questionsPerDay.labels || ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        questionsChart.data.datasets[0].data = data.questionsPerDay.data || [0, 0, 0, 0, 0, 0, 0];
        questionsChart.update();
      }
    }

    // Update learners list with real data
    function updateLearnersList(learners) {
      const learnersListEl = document.getElementById('learnersList');
      if (learnersListEl && Array.isArray(learners)) {
        if (learners.length === 0) {
          learnersListEl.innerHTML = '<div class="learner-item"><div class="learner-info"><div class="learner-name">No learners found</div></div></div>';
          return;
        }
        
        learnersListEl.innerHTML = learners.map(learner => `
          <div class="learner-item">
            <div class="learner-avatar">
              <div class="avatar-circle"></div>
            </div>
            <div class="learner-info">
              <div class="learner-name">${learner.username}</div>
              <div class="learner-status">${learner.status}</div>
            </div>
          </div>
        `).join('');
      }
    }

    // Handle learner filter change
    function handleLearnerFilterChange() {
      loadLearnersList();
    }

    // Initialize dashboard
    window.onload = function() {
      loadSidebar();
      checkAuth();
      // Initialize charts after a short delay to ensure canvas elements are ready
      setTimeout(() => {
        initializeCharts();
      }, 100);
    };
  </script>
</body>
</html>
